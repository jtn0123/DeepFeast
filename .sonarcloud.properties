# SonarCloud automatic analysis covers the Python tools, the web prototype and other
# non-compiled files. It does not analyse the game's C# (unity/): that needs a CI-based
# scanner that builds the project.
# art-drafts/ is review material, not code that ships: concept and comparison pages,
# capture scripts for each visual pass, and an archived copy of the browser prototype.
sonar.exclusions=art-drafts/**
