<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Deep Feast</title>
<style>
  :root { --ui: ui-rounded, "SF Pro Rounded", "Nunito", "Avenir Next", "Trebuchet MS", system-ui, sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #03121f; color: #eafcff;
    font-family: var(--ui); user-select: none; -webkit-user-select: none; touch-action: none; }
  canvas { display: block; position: fixed; inset: 0; cursor: crosshair; }

  #hud { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .5s; }
  #hud.on { opacity: 1; }
  .tl { position: absolute; left: 22px; top: 14px; }
  #score { font-size: 36px; font-weight: 900; letter-spacing: .5px; text-shadow: 0 2px 14px rgba(0,30,60,.7); }
  #combo { font-size: 16px; font-weight: 900; color: #ffd447; height: 22px; letter-spacing: 1px;
    text-shadow: 0 0 12px rgba(255,180,40,.7); }
  .tc { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); text-align: center; width: min(440px, 56vw); }
  #tierName { font-size: 13px; font-weight: 900; letter-spacing: 4px; text-transform: uppercase; color: #c4f7ff; }
  .bar { margin-top: 6px; height: 12px; border-radius: 99px; background: rgba(0,18,36,.5);
    border: 1px solid rgba(180,240,255,.28); overflow: hidden; box-shadow: inset 0 1px 4px rgba(0,0,0,.45); }
  #growth { height: 100%; width: 0; border-radius: 99px; transition: width .25s;
    background: linear-gradient(90deg, #2ef2c8, #4fd1ff 60%, #ffd447); box-shadow: 0 0 14px rgba(80,240,220,.8); }
  #tierNext { margin-top: 5px; font-size: 11px; opacity: .7; letter-spacing: 1px; }
  .tr { position: absolute; right: 22px; top: 18px; display: flex; gap: 6px; }
  .tr svg { width: 32px; height: 20px; filter: drop-shadow(0 2px 6px rgba(0,0,0,.4)); }
  .bl { position: absolute; left: 22px; bottom: 20px; width: 170px; }
  .lbl { font-size: 10px; letter-spacing: 3px; opacity: .75; font-weight: 800; }
  #depth { font-size: 12px; opacity: .8; margin-bottom: 8px; letter-spacing: 1px; }
  .bar.small { height: 8px; margin-top: 4px; }
  #dash { height: 100%; width: 100%; background: linear-gradient(90deg, #ff9f43, #ffd447); transition: background .2s; }
  #dash.tired { background: #6b7c88; }

  #banner { position: fixed; left: 50%; top: 22%; transform: translate(-50%,-50%); text-align: center;
    pointer-events: none; opacity: 0; width: 92vw; }
  #banner.show { animation: bannerIn 2.6s ease forwards; }
  #banner h2 { margin: 0; font-size: clamp(34px, 7vw, 68px); font-weight: 900; letter-spacing: 3px;
    color: #fff; -webkit-text-stroke: 1.5px rgba(0,30,50,.45);
    text-shadow: 0 4px 0 rgba(0,30,50,.55), 0 0 30px var(--glow, rgba(80,240,220,.8)), 0 0 60px rgba(0,20,40,.5); }
  #banner p { margin: 8px 0 0; font-size: 17px; font-weight: 800; text-shadow: 0 1px 2px rgba(0,20,40,.9), 0 2px 12px rgba(0,20,40,.8); }
  @keyframes bannerIn {
    0% { opacity: 0; transform: translate(-50%,-35%) scale(.7); }
    10% { opacity: 1; transform: translate(-50%,-50%) scale(1.06); }
    18% { transform: translate(-50%,-50%) scale(1); }
    80% { opacity: 1; transform: translate(-50%,-50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%,-62%) scale(.98); }
  }

  .overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, rgba(0,20,40,.05), rgba(0,8,20,.55)); transition: opacity .35s, visibility 0s; }
  .overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .35s, visibility 0s .35s; }
  .panel { text-align: center; padding: 34px 46px 30px; border-radius: 30px; background: rgba(6,40,66,.38);
    border: 1px solid rgba(160,240,255,.24); backdrop-filter: blur(9px); -webkit-backdrop-filter: blur(9px);
    box-shadow: 0 24px 70px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.12); max-width: 92vw; }
  .t1, .t2 { font-size: clamp(54px, 11vw, 110px); font-weight: 900; line-height: .88; letter-spacing: 3px;
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .t1 { background-image: linear-gradient(180deg, #ffffff 0%, #a6f4ff 50%, #31d4c8 100%);
    filter: drop-shadow(0 6px 20px rgba(0,190,210,.5)); }
  .t2 { background-image: linear-gradient(180deg, #fff1a8 0%, #ffc04d 55%, #ff7a3d 100%);
    filter: drop-shadow(0 6px 20px rgba(255,140,40,.45)); }
  .title { animation: bob 3.2s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-7px) rotate(-1deg); } }
  .tag { margin: 18px 0 24px; font-size: 17px; font-weight: 700; opacity: .9; }
  button { pointer-events: auto; font-family: var(--ui); font-size: 22px; font-weight: 900; letter-spacing: 3px;
    color: #053040; padding: 15px 52px; border: 0; border-radius: 99px; cursor: pointer;
    background: linear-gradient(180deg, #8dfde6, #21c6b6); text-transform: uppercase;
    box-shadow: 0 6px 0 #0f7f7a, 0 14px 34px rgba(30,220,200,.45); transition: transform .08s, box-shadow .08s; }
  button:hover { transform: translateY(-2px); box-shadow: 0 8px 0 #0f7f7a, 0 18px 40px rgba(30,220,200,.55); }
  button:active { transform: translateY(4px); box-shadow: 0 2px 0 #0f7f7a, 0 8px 20px rgba(30,220,200,.4); }
  .keys { margin-top: 24px; font-size: 13px; opacity: .8; line-height: 2; }
  kbd { font-family: var(--ui); font-weight: 800; font-size: 11px; padding: 2px 7px; border-radius: 6px;
    background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.22); }
  .best { margin-top: 12px; font-size: 13px; letter-spacing: 2px; opacity: .7; }
  .stats { display: grid; grid-template-columns: repeat(2, minmax(120px, 1fr)); gap: 10px 22px; margin: 20px 0 26px; }
  .stat { background: rgba(0,20,40,.35); border-radius: 14px; padding: 10px 14px; }
  .stat b { display: block; font-size: 26px; }
  .stat span { font-size: 11px; letter-spacing: 2px; opacity: .7; text-transform: uppercase; }
  h3 { margin: 0; font-size: clamp(36px, 7vw, 60px); font-weight: 900; letter-spacing: 2px; }
  .newbest { color: #ffd447; font-weight: 900; letter-spacing: 3px; height: 18px; margin-top: 6px; }

  .corner { position: fixed; right: 16px; bottom: 16px; display: flex; gap: 10px; }
  .iconbtn { pointer-events: auto; width: 44px; height: 44px; padding: 0; font-size: 18px; letter-spacing: 0;
    border-radius: 50%; background: rgba(6,40,66,.5); color: #dff; border: 1px solid rgba(160,240,255,.3);
    box-shadow: none; }
  .iconbtn:hover, .iconbtn:active { transform: none; box-shadow: none; background: rgba(20,70,100,.6); }
  #dashBtn { display: none; position: fixed; right: 26px; bottom: 80px; width: 92px; height: 92px; border-radius: 50%;
    pointer-events: auto; background: radial-gradient(circle at 35% 30%, rgba(255,220,120,.55), rgba(255,140,40,.35));
    border: 2px solid rgba(255,220,140,.6); color: #fff; font-weight: 900; letter-spacing: 2px; font-size: 14px;
    align-items: center; justify-content: center; }
  body.touch #dashBtn { display: flex; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="tl"><div id="score">0</div><div id="combo"></div></div>
  <div class="tc">
    <div id="tierName">Fry</div>
    <div class="bar"><div id="growth"></div></div>
    <div id="tierNext"></div>
  </div>
  <div class="tr" id="lives"></div>
  <div class="bl">
    <div id="depth">0 m</div>
    <div class="lbl">DASH</div>
    <div class="bar small"><div id="dash"></div></div>
  </div>
</div>

<div id="banner"><h2 id="bannerTitle"></h2><p id="bannerSub"></p></div>

<div id="menu" class="overlay">
  <div class="panel">
    <div class="title"><div class="t1">DEEP</div><div class="t2">FEAST</div></div>
    <p class="tag">Eat smaller fish. Dodge bigger ones. Grow into a legend.</p>
    <button id="playBtn">Play</button>
    <div class="keys">
      <kbd>Mouse</kbd> / <kbd>Touch</kbd> / <kbd>WASD</kbd> steer &nbsp;·&nbsp; hold <kbd>Click</kbd> / <kbd>Space</kbd> dash<br>
      <kbd>P</kbd> pause &nbsp;·&nbsp; <kbd>M</kbd> mute
    </div>
    <div class="best">BEST&nbsp; <b id="bestMenu">0</b></div>
  </div>
</div>

<div id="pause" class="overlay hidden">
  <div class="panel"><h3>Paused</h3><p class="tag">Take a breath. The sharks will wait.</p><button id="resumeBtn">Resume</button></div>
</div>

<div id="over" class="overlay hidden">
  <div class="panel">
    <h3 id="overTitle">Gobbled!</h3>
    <div class="newbest" id="newBest"></div>
    <div class="stats">
      <div class="stat"><b id="sScore">0</b><span>Score</span></div>
      <div class="stat"><b id="sTier">Fry</b><span>Top tier</span></div>
      <div class="stat"><b id="sEaten">0</b><span>Fish eaten</span></div>
      <div class="stat"><b id="sTime">0:00</b><span>Survived</span></div>
    </div>
    <button id="againBtn">Swim again</button>
    <div class="best">BEST&nbsp; <b id="bestOver">0</b></div>
  </div>
</div>

<div class="corner"><button class="iconbtn" id="muteBtn" title="Mute (M)">♪</button></div>
<div id="dashBtn">DASH</div>

<script>
(() => {
'use strict';

// ============================================================ canvas
const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
const darkCvs = document.createElement('canvas');
const dctx = darkCvs.getContext('2d');
let W = 0, H = 0, DPR = 1, vignette = null;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cvs.width = Math.round(W * DPR); cvs.height = Math.round(H * DPR);
  cvs.style.width = W + 'px'; cvs.style.height = H + 'px';
  darkCvs.width = Math.max(1, Math.round(W / 2)); darkCvs.height = Math.max(1, Math.round(H / 2));
  vignette = document.createElement('canvas');
  vignette.width = cvs.width; vignette.height = cvs.height;
  const v = vignette.getContext('2d');
  const cx = vignette.width / 2, cy = vignette.height / 2;
  const g = v.createRadialGradient(cx, cy, Math.min(cx, cy) * 0.6, cx, cy, Math.hypot(cx, cy));
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,8,22,0.62)');
  v.fillStyle = g; v.fillRect(0, 0, vignette.width, vignette.height);
}
window.addEventListener('resize', resize);
resize();

// ============================================================ utils
const TAU = Math.PI * 2;
const rand = (a = 0, b = 1) => a + Math.random() * (b - a);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const pick = (arr) => arr[(Math.random() * arr.length) | 0];
const hash = (n) => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
function mulberry32(a) {
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function makeNoise(seed) {
  const r = mulberry32(seed), N = 512, v = new Float32Array(N);
  for (let i = 0; i < N; i++) v[i] = r() * 2 - 1;
  return (x) => {
    const i = Math.floor(x), f = x - i, s = f * f * (3 - 2 * f);
    const a = v[((i % N) + N) % N], b = v[(((i + 1) % N) + N) % N];
    return a + (b - a) * s;
  };
}
const mixC = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const rgba = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;

// ============================================================ world
const WORLD = { w: 14000, h: 4400 };
const FSTEP = 20;
let floorS = null;

const WATER = [
  [0, [72, 202, 230]], [700, [28, 150, 198]], [1700, [14, 98, 156]],
  [2800, [9, 62, 114]], [3800, [6, 36, 78]], [4600, [4, 20, 46]],
];
function waterAt(y) {
  if (y <= 0) return WATER[0][1];
  for (let i = 0; i < WATER.length - 1; i++) {
    const [y0, c0] = WATER[i], [y1, c1] = WATER[i + 1];
    if (y <= y1) return mixC(c0, c1, (y - y0) / (y1 - y0));
  }
  return WATER[WATER.length - 1][1];
}
const darkAt = (y) => Math.pow(clamp((y - 900) / 3300, 0, 1), 1.2) * 0.58;

// hand-laid seabed: trench → kelp slope → reef → sand flats → reef → abyss → kelp
const PROFILE = [[0, 3600], [1500, 3950], [2600, 2950], [3800, 2500], [4700, 1350], [5500, 950], [6300, 1150],
  [7000, 1900], [7800, 1650], [8600, 1050], [9300, 1500], [10200, 3300], [11000, 4100], [11800, 3950],
  [12600, 2800], [13400, 2400], [14000, 2650]];
function profileY(x) {
  for (let i = 0; i < PROFILE.length - 1; i++) {
    const [x0, y0] = PROFILE[i], [x1, y1] = PROFILE[i + 1];
    if (x <= x1) { const t = (x - x0) / (x1 - x0); return lerp(y0, y1, t * t * (3 - 2 * t)); }
  }
  return PROFILE[PROFILE.length - 1][1];
}
function genFloor() {
  const n1 = makeNoise(11), n2 = makeNoise(23), n3 = makeNoise(37);
  const N = Math.ceil(WORLD.w / FSTEP) + 2;
  floorS = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    const x = i * FSTEP;
    floorS[i] = clamp(profileY(x) + 260 * n1(x / 900) + 140 * n2(x / 300) + 30 * n3(x / 90), 700, 4180);
  }
}
function floorY(x) {
  const fx = clamp(x, 0, WORLD.w) / FSTEP, i = fx | 0, f = fx - i;
  return lerp(floorS[i], floorS[Math.min(i + 1, floorS.length - 1)], f);
}

const decor = { back: [], mid: [], front: [], glow: [] };
const CORAL = ['#ff6f91', '#ff9f5a', '#c77dff', '#ff4d6d', '#48cae4', '#ffd166', '#f15bb5', '#7bf1a8'];

function blob(R, n, jitter) {
  const pts = [];
  for (let i = 0; i < n; i++) pts.push([(i / n) * TAU, 1 + (R() * 2 - 1) * jitter]);
  return pts;
}
function genBranch(R, x, y, ang, len, lvl, maxLvl, levels) {
  const x2 = x + Math.cos(ang) * len, y2 = y + Math.sin(ang) * len;
  (levels[lvl] = levels[lvl] || []).push([x, y, x2, y2]);
  if (lvl < maxLvl) {
    const n = 2 + (R() < 0.35 ? 1 : 0);
    for (let i = 0; i < n; i++) {
      genBranch(R, x2, y2, ang + (i - (n - 1) / 2) * 0.55 + (R() - 0.5) * 0.5, len * (0.62 + R() * 0.2), lvl + 1, maxLvl, levels);
    }
  }
}

function genWorld() {
  genFloor();
  const R = mulberry32(4242);
  const pickR = (arr) => arr[(R() * arr.length) | 0];

  // kelp forests
  for (let x = 200; x < WORLD.w - 200; x += 70 + R() * 260) {
    const fy = floorY(x);
    if (fy < 1100 || fy > 3750 || R() < 0.45) continue;
    const n = 2 + Math.floor(R() * 4);
    for (let k = 0; k < n; k++) {
      const kx = x + k * (18 + R() * 34);
      decor.back.push({ type: 'kelp', x: kx, y: floorY(kx) + 12, h: Math.min(fy - 120, 280 + R() * (fy > 2600 ? 950 : 620)),
        w: 9 + R() * 9, phase: R() * TAU, tone: R() });
    }
  }
  // rocks
  for (let x = 80; x < WORLD.w; x += 130 + R() * 420) {
    const s = 40 + R() * 110;
    decor.mid.push({ type: 'rock', x, y: floorY(x) + s * 0.32, s, pts: blob(R, 9, 0.22), tone: R() });
  }
  // coral reef (shallow floors)
  for (let x = 120; x < WORLD.w - 120; x += 40 + R() * 120) {
    const fy = floorY(x);
    if (fy > 2950 || R() < 0.22) continue;
    const k = R(), col = pickR(CORAL), s = 40 + R() * 95, y = floorY(x) + 6;
    if (k < 0.38) {
      const levels = [];
      genBranch(R, 0, 0, -Math.PI / 2 + (R() - 0.5) * 0.4, s * 0.42, 0, 3, levels);
      decor.front.push({ type: 'branch', x, y, s, col, levels, tip: pickR(['#fff2b3', '#ffffff', '#ffd6e8']) });
    } else if (k < 0.58) {
      const ribs = [];
      const n = 9 + Math.floor(R() * 4);
      for (let i = 0; i < n; i++) ribs.push([-Math.PI + 0.35 + (i / (n - 1)) * (Math.PI - 0.7), 0.75 + R() * 0.25]);
      decor.front.push({ type: 'fan', x, y, s: s * 1.1, col, ribs, phase: R() * TAU });
    } else if (k < 0.8) {
      decor.front.push({ type: 'brain', x, y: y + 4, s: s * 0.9, col, seed: R() * 100 });
    } else {
      const tubes = [];
      const n = 2 + Math.floor(R() * 3);
      for (let i = 0; i < n; i++) tubes.push([(i - (n - 1) / 2) * s * 0.22 + (R() - 0.5) * 8, s * (0.5 + R() * 0.7), s * (0.1 + R() * 0.06)]);
      decor.front.push({ type: 'tube', x, y, s, col, tubes });
    }
  }
  // anemones (glowing ones live in the deep)
  for (let x = 150; x < WORLD.w - 150; x += 160 + R() * 480) {
    if (R() < 0.4) continue;
    const fy = floorY(x), deep = fy > 3150;
    const hue = deep ? pickR([185, 285, 160, 320]) : pickR([345, 20, 35, 300]);
    const a = { type: 'anem', x, y: floorY(x) + 4, s: 26 + R() * 44, hue, deep, phase: R() * TAU, n: 9 + Math.floor(R() * 6) };
    decor.front.push(a);
    if (deep) decor.glow.push(a);
  }
  // seagrass tufts
  for (let x = 40; x < WORLD.w - 40; x += 28 + R() * 110) {
    const fy = floorY(x);
    if (fy > 3400 || R() < 0.35) continue;
    decor.front.push({ type: 'grass', x, y: floorY(x) + 6, s: 22 + R() * 46, n: 3 + Math.floor(R() * 4), phase: R() * TAU });
  }
  for (const k of ['back', 'mid', 'front']) decor[k].sort((a, b) => a.x - b.x);
}

// ============================================================ species
const SHAPES = {
  slim:    { hh: 0.36, nx: 0.92, ny: 0.95, ped: 0.2,  tl: 0.48, tH: 0.38, dH: 0.18, aH: 0.12, tail: 'fork',   eye: 0.11 },
  oval:    { hh: 0.50, nx: 0.95, ny: 1.0,  ped: 0.2,  tl: 0.45, tH: 0.42, dH: 0.22, aH: 0.15, tail: 'fork',   eye: 0.11 },
  disc:    { hh: 0.66, nx: 0.85, ny: 1.05, ped: 0.18, tl: 0.36, tH: 0.40, dH: 0.16, aH: 0.14, tail: 'lunate', eye: 0.1 },
  tall:    { hh: 0.70, nx: 0.8,  ny: 1.0,  ped: 0.18, tl: 0.38, tH: 0.38, dH: 0.72, aH: 0.72, tail: 'fan',    eye: 0.1, trailing: true },
  round:   { hh: 0.80, nx: 1.05, ny: 1.15, ped: 0.22, tl: 0.30, tH: 0.30, dH: 0.12, aH: 0.10, tail: 'fan',    eye: 0.14 },
  long:    { hh: 0.20, nx: 0.6,  ny: 0.8,  ped: 0.3,  tl: 0.40, tH: 0.32, dH: 0.20, aH: 0.14, tail: 'fork',   eye: 0.07 },
  fat:     { hh: 0.56, nx: 0.98, ny: 1.05, ped: 0.2,  tl: 0.38, tH: 0.40, dH: 0.20, aH: 0.14, tail: 'fan',    eye: 0.09 },
  torpedo: { hh: 0.36, nx: 0.8,  ny: 0.95, ped: 0.14, tl: 0.45, tH: 0.50, dH: 0.22, aH: 0.18, tail: 'lunate', eye: 0.08 },
  shark:   { hh: 0.30, nx: 0.5,  ny: 0.7,  ped: 0.14, tl: 0.60, tH: 0.55, dH: 0.42, aH: 0.12, tail: 'shark',  eye: 0.055 },
};
const SPECIES = {
  minnow:    { shape: 'slim',    c: ['#cfe9ff', '#5b8fc4', '#f4fbff'], fin: 'rgba(156,199,238,.85)', pat: 'line',   min: 3,  max: 14 },
  clown:     { shape: 'oval',    c: ['#ff8c2b', '#c94c0c', '#ffd0a0'], fin: '#ff7a1a', pat: 'bands',   min: 7,  max: 22 },
  tang:      { shape: 'disc',    c: ['#2f86ff', '#1340a8', '#8cc2ff'], fin: '#1d5fe0', pat: 'tang',    min: 9,  max: 28, tailCol: '#ffd23f' },
  angel:     { shape: 'tall',    c: ['#ffe55c', '#d9a300', '#fff6c2'], fin: '#ffd21f', pat: 'stripes', min: 13, max: 38 },
  puffer:    { shape: 'round',   c: ['#e9d585', '#9c8640', '#fffbe3'], fin: '#d8c06a', pat: 'spots',   min: 16, max: 48, spot: '#5a4818' },
  parrot:    { shape: 'oval',    c: ['#3ee0a8', '#1a8f8a', '#c8ffe9'], fin: '#ff7ac8', pat: 'scales',  min: 20, max: 60 },
  snapper:   { shape: 'oval',    c: ['#ff5f6f', '#b4253a', '#ffd0d4'], fin: '#ff7a88', pat: 'none',    min: 22, max: 64 },
  barracuda: { shape: 'long',    c: ['#b4c3d1', '#5d6e80', '#eef4f9'], fin: '#8a9bab', pat: 'bars',    min: 34, max: 130 },
  grouper:   { shape: 'fat',     c: ['#9a7650', '#5d432a', '#e2cba9'], fin: '#7d5d3c', pat: 'spots',   min: 48, max: 180, spot: '#3a2814' },
  tuna:      { shape: 'torpedo', c: ['#4d6d9c', '#1d2f52', '#e3e9f2'], fin: '#5a7bb0', pat: 'finlets', min: 70, max: 600 },

const SHARK_SP = { shape: 'shark', c: ['#62788b', '#283746', '#f2f5f7'], fin: '#4a5f72', pat: 'shark' };
const PLAYER_SP = { shape: 'oval', c: ['#3df2d0', '#0a8f99', '#e2fff8'], fin: '#ffc93c', pat: 'player', eye: 0.15 };

function speciesFor(r, school) {
  const keys = Object.keys(SPECIES).filter((k) => {
    const s = SPECIES[k];
    if (k === 'minnow' && !school && r > 6) return false;
    return r >= s.min && r <= s.max;
  });
  if (!keys.length) return r < 5 ? 'minnow' : 'tuna';
  return pick(keys);
}

  { name: 'Fry',       r: 12,  blurb: 'Snack on minnows. Avoid everything else.' },
  { name: 'Minnow',    r: 19,  blurb: 'Clownfish are on the menu.' },
  { name: 'Hunter',    r: 30,  blurb: 'Angelfish and tangs fear you now.' },

  { name: 'Apex',      r: 73,  blurb: 'Barracuda bow before you.' },

];
const EAT = 0.9, DANGER = 1.1, GROW = 0.16;
const scaleM = () => clamp(Math.min(W, H) / 820, 0.6, 1.25);
const zoomFor = (r) => ((24 + (r - 12) * 0.3) / r) * scaleM();
const speedFor = (r) => ((235 + (r - 12) * 0.25) * scaleM()) / zoomFor(r);

};

for (let i = 0; i < 110; i++) snow.push({ x: rand(0, 4000), y: rand(0, 4000), z: rand(0.25, 1), ph: rand(0, TAU) });
