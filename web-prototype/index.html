// ============================================================ audio
const Sound = {
  ac: null, master: null, nbuf: null, muted: localStorage.getItem('deepfeast.muted') === '1',
  init() {
    if (this.ac) { if (this.ac.state === 'suspended') this.ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ac = new AC();
    this.master = this.ac.createGain();
    this.master.gain.value = this.muted ? 0 : 0.5;
    this.master.connect(this.ac.destination);
    const len = this.ac.sampleRate;
    this.nbuf = this.ac.createBuffer(1, len, this.ac.sampleRate);
    const d = this.nbuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.ambient();
  },
  setMuted(m) {
    this.muted = m;
    localStorage.setItem('deepfeast.muted', m ? '1' : '0');
    if (this.master) this.master.gain.setTargetAtTime(m ? 0 : 0.5, this.ac.currentTime, 0.05);
  },
  tone(f0, f1, dur, type = 'sine', vol = 0.2, delay = 0) {
    if (!this.ac) return;
    const t = this.ac.currentTime + delay;
    const o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.03);
  },
  noise(dur, vol, freq, q = 1, delay = 0) {
    if (!this.ac) return;
    const t = this.ac.currentTime + delay;
    const s = this.ac.createBufferSource(), f = this.ac.createBiquadFilter(), g = this.ac.createGain();
    s.buffer = this.nbuf;
    f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.master);
    s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
  },
  ambient() {
    const len = this.ac.sampleRate * 3;
    const buf = this.ac.createBuffer(1, len, this.ac.sampleRate);
    const d = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) { last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; d[i] = last * 3.5; }
    const s = this.ac.createBufferSource(); s.buffer = buf; s.loop = true;
    const f = this.ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 420;
    const lfo = this.ac.createOscillator(), lg = this.ac.createGain();
    lfo.frequency.value = 0.07; lg.gain.value = 160; lfo.connect(lg); lg.connect(f.frequency); lfo.start();
    const g = this.ac.createGain(); g.gain.value = 0.22;
    s.connect(f); f.connect(g); g.connect(this.master); s.start();
  },
  chomp(rel, combo) {
    const p = clamp(560 - rel * 260, 160, 620) * (1 + Math.min(combo, 8) * 0.04);
    this.tone(p, p * 0.42, 0.11, 'triangle', 0.22);
    this.noise(0.07, 0.2, 2400, 0.9);
    if (combo > 1) this.tone(660 * Math.pow(1.0595, combo * 2), 0, 0.14, 'sine', 0.07, 0.05);
  },
  tierUp() { [523, 659, 784, 1047, 1319].forEach((f, i) => this.tone(f, 0, 0.4, 'triangle', 0.13, i * 0.085)); },
  hurt() { this.tone(240, 50, 0.6, 'sawtooth', 0.16); this.noise(0.35, 0.25, 420, 0.7); },
  alert() { this.tone(900, 700, 0.1, 'square', 0.035); },
  shark() { [0, 0.42, 0.75, 1.0, 1.2].forEach((d, i) => this.tone(i % 2 ? 87.3 : 82.4, 0, 0.3, 'sawtooth', 0.11, d)); },
  zap() { this.tone(1600, 260, 0.28, 'sawtooth', 0.06); this.noise(0.22, 0.16, 5200, 2); },
  pearl() { [1047, 1319, 1568, 2093].forEach((f, i) => this.tone(f, 0, 0.3, 'sine', 0.09, i * 0.06)); },
  dash() { this.noise(0.28, 0.16, 800, 0.5); },
  bump() { this.tone(180, 120, 0.08, 'sine', 0.08); },
};

// ============================================================ entities
function makeFish(spKey, r, x, y, dir) {
  const sp = SPECIES[spKey];
  const f = {
    id: nextId++, sp, kind: 'fish', r, x, y, vx: dir * 20, vy: 0, face: dir, faceS: dir, tilt: 0,
    wag: rand(0, TAU), dir, phase: rand(0, TAU), cruise: rand(0.3, 0.5), homeY: y, homeT: rand(2, 7),
    state: 'wander', cool: rand(1.5, 4), chaseT: 0, alertT: 0, mouth: 0, chomp: 0, eatCool: 2,
    school: null, aggro: rand(0.5, 1.2), spots: null,
  };
  if (sp.pat === 'spots') {
    f.spots = [];
    const n = 8 + ((Math.random() * 8) | 0);
    for (let i = 0; i < n; i++) f.spots.push([rand(-0.75, 0.75), rand(-0.6, 0.6), rand(0.05, 0.12)]);
  }
  return f;
}

function inWater(x, y, r) {
  return x > 120 && x < WORLD.w - 120 && y > 70 + r && y < floorY(x) - r - 25;
}

function spawnSchool(x, y, dir, r, n) {
  const key = r <= 13 ? 'minnow' : speciesFor(r, true);
  const s = { dir, fleeT: 0, turnT: rand(6, 14), cx: x, cy: y, n: 0, vx: 0 };
  schools.push(s);
  for (let i = 0; i < n; i++) {
    const fr = r * rand(0.85, 1.12);
    const fx = x + rand(-1, 1) * r * 5, fy = clamp(y + rand(-1, 1) * r * 3, 80, floorY(fx) - fr - 30);
    const f = makeFish(key, fr, fx, fy, dir);
    f.school = s; f.slotX = rand(-1, 1) * r * 5; f.slotY = rand(-1, 1) * r * 3;
    f.cruise = 0.42;
    fish.push(f);
  }
}

function rollSize(pr) {
  const threatP = game.tier >= 5 ? 0.08 : 0.2 + Math.min(game.tier, 3) * 0.03;
  const u = Math.random();
  if (u < threatP) return { r: pr * rand(1.25, 2.3), threat: true };
  const v = Math.random();
  if (v < 0.22) return { r: pr * rand(0.28, 0.5), school: true };
  if (v < 0.36) return { r: pr * rand(0.18, 0.34) };
  return { r: pr * rand(0.4, 0.86) };
}

function spawnOne(initial) {
  const pr = focusR(), vw = viewW(), vh = viewH();
  let roll = rollSize(pr);
  if (roll.threat) {
    let threats = 0;
    for (const f of fish) if (f.r >= pr * DANGER) threats++;
    if (threats >= 7) roll = { r: pr * rand(0.4, 0.86) };
  }
  roll.r = Math.max(3, roll.r);
  let x, y, dir;
  if (initial) {
    x = cam.x + rand(-0.95, 0.95) * vw;
    y = cam.y + rand(-0.85, 0.85) * vh;
    dir = Math.random() < 0.5 ? 1 : -1;
    if (player.active && Math.hypot(x - player.x, y - player.y) < vw * (roll.threat ? 0.55 : 0.12)) return;
  } else {
    const side = Math.random() < 0.5 ? -1 : 1;
    x = cam.x + side * (vw * 0.5 + rand(roll.r * 2.5 + 30, vw * 0.32));
    y = cam.y + rand(-0.6, 0.6) * vh;
    dir = Math.random() < 0.78 ? -side : side;
  }
  const fy = floorY(x);
  y = Math.min(y, fy - roll.r * 2 - 40);
  if (!inWater(x, y, roll.r)) return;
  if (roll.school) spawnSchool(x, y, dir, roll.r, 5 + ((Math.random() * 6) | 0));
  else fish.push(makeFish(speciesFor(roll.r), roll.r, x, y, dir));
}

function spawnJelly() {
  const pr = focusR(), vw = viewW(), vh = viewH();
  const side = Math.random() < 0.5 ? -1 : 1;
  const x = cam.x + side * (vw * 0.5 + rand(60, vw * 0.4));
  const r = Math.max(9, pr * rand(0.75, 1.35));
  const y = clamp(cam.y + rand(-0.5, 0.5) * vh, 650, floorY(x) - r * 4 - 60);
  if (!inWater(x, y, r * 2)) return;
  jellies.push({ x, y, r, vx: rand(-0.04, 0.04) * speedFor(pr), vy: 0, phase: rand(0, TAU), pf: rand(1.6, 2.4),
    hue: pick([300, 320, 190, 270, 200]) });
}

function spawnShark() {
  const pr = player.r, vw = viewW();
  const edible = game.tier >= 5;
  const side = -player.face || 1;
  const r = edible ? pr * 0.75 : pr * 3.2;
  const x = clamp(player.x + side * (vw * 0.62 + r * 2), 200, WORLD.w - 200);
  const y = clamp(player.y + rand(-150, 150), 120 + r, floorY(x) - r - 60);
  const s = makeFish('tuna', r, x, y, -side);
  s.sp = SHARK_SP; s.kind = 'shark'; s.life = 14; s.state = 'chase'; s.leaveDir = side; s.alertT = 1.4;
  fish.push(s);
  if (edible) banner('SHARK!', 'You are the Leviathan now — hunt it down!', 'rgba(255,200,60,.9)');
  else banner('⚠ SHARK!', 'Hold click / Space to dash away', 'rgba(255,60,80,.95)');
  Sound.shark();
}

function spawnPearl() {
  const pr = player.r, vw = viewW(), vh = viewH();
  for (let t = 0; t < 12; t++) {
    const x = cam.x + rand(-0.38, 0.38) * vw, y = cam.y + rand(-0.36, 0.36) * vh;
    if (!inWater(x, y, pr) || Math.hypot(x - player.x, y - player.y) < pr * 5) continue;
    pearls.push({ x, y, r: Math.max(6, pr * 0.32), life: 16, ph: rand(0, TAU) });
    return;
  }
}

// ============================================================ particles
function addP(p) { if (particles.length < 600) particles.push(p); }
function bubble(x, y, s, vy) {
  addP({ type: 'bubble', x, y, vx: rand(-0.3, 0.3) * s, vy: vy ?? -rand(2.5, 5) * s, life: rand(1.2, 2.6), max: 2.6, size: s * rand(0.5, 1.2), ph: rand(0, TAU) });
}
function burst(x, y, r, col) {
  for (let i = 0; i < 10; i++) {
    const a = rand(0, TAU), sp = rand(0.6, 2.4) * r;
    addP({ type: 'bit', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(0.5, 1), max: 1, size: r * rand(0.1, 0.22), col });
  }
  for (let i = 0; i < 7; i++) bubble(x + rand(-r, r) * 0.6, y + rand(-r, r) * 0.6, r * 0.22);
  addP({ type: 'ring', x, y, life: 0.45, max: 0.45, size: r * 1.1, col: 'rgba(255,255,255,' });
}
function sparkle(x, y, r, n, col) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), sp = rand(0.5, 2) * r;
    addP({ type: 'spark', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(0.5, 1.1), max: 1.1, size: r * rand(0.08, 0.18), col });
  }
}
function addText(x, y, text, col, size = 22) { texts.push({ x, y, text, col, size, life: 1.1, max: 1.1 }); }

// ============================================================ ui
const $ = (id) => document.getElementById(id);
const ui = {
  hud: $('hud'), score: $('score'), combo: $('combo'), tierName: $('tierName'), growth: $('growth'),
  tierNext: $('tierNext'), lives: $('lives'), dash: $('dash'), depth: $('depth'),
  menu: $('menu'), pause: $('pause'), over: $('over'), banner: $('banner'),
};
const cache = {};
function setText(el, key, v) { if (cache[key] !== v) { cache[key] = v; el.textContent = v; } }
const LIFE_SVG = '<svg viewBox="0 0 32 20"><path d="M2 10 L8 4 L8 16 Z" fill="#ffc93c"/><ellipse cx="18" cy="10" rx="12" ry="7.5" fill="#3df2d0"/><path d="M12 4.5 Q18 7 27 8" stroke="#ffd447" stroke-width="2" fill="none"/><circle cx="24" cy="8.5" r="2.4" fill="#fff"/><circle cx="24.6" cy="8.5" r="1.4" fill="#0b0f14"/></svg>';

function updateHUD() {
  setText(ui.score, 'score', game.score.toLocaleString());
  setText(ui.combo, 'combo', game.combo > 1 && game.comboT > 0 ? `COMBO ×${game.combo}` : '');
  const t = game.tier, cur = TIERS[t], nxt = TIERS[t + 1];
  setText(ui.tierName, 'tier', cur.name);
  const prog = nxt ? clamp((player.r - cur.r) / (nxt.r - cur.r), 0, 1) : 1;
  const pw = (prog * 100).toFixed(1) + '%';
  if (cache.pw !== pw) { cache.pw = pw; ui.growth.style.width = pw; }
  setText(ui.tierNext, 'next', nxt ? `next: ${nxt.name.toUpperCase()}` : 'MAXIMUM SIZE');
  if (cache.lives !== game.lives) { cache.lives = game.lives; ui.lives.innerHTML = LIFE_SVG.repeat(Math.max(0, game.lives)); }
  const dw = (player.stamina * 100).toFixed(0) + '%';
  if (cache.dw !== dw) { cache.dw = dw; ui.dash.style.width = dw; }
  ui.dash.classList.toggle('tired', player.tired);
  setText(ui.depth, 'depth', `DEPTH ${Math.max(0, Math.round(player.y / 8))} m`);
}

let bannerTimer = 0;
function banner(title, sub, glow) {
  $('bannerTitle').textContent = title;
  $('bannerSub').textContent = sub || '';
  ui.banner.style.setProperty('--glow', glow || 'rgba(80,240,220,.85)');
  ui.banner.classList.remove('show');
  void ui.banner.offsetWidth;
  ui.banner.classList.add('show');
  clearTimeout(bannerTimer);
  bannerTimer = setTimeout(() => ui.banner.classList.remove('show'), 2700);
}
function hint(key, title, sub, glow) {
  if (game.hints[key]) return;
  game.hints[key] = true;
  banner(title, sub, glow);
}

// ============================================================ game flow
function findStart() {
  // begin over the shallowest reef in the middle of the map
  let best = WORLD.w / 2;
  for (let x = 2500; x <= WORLD.w - 2500; x += 40) if (floorY(x) < floorY(best)) best = x;
  return { x: best, y: Math.max(160, floorY(best) - 260) };
}

function startGame() {
  Sound.init();
  fish.length = 0; schools = []; jellies.length = 0; pearls.length = 0; particles.length = 0; texts.length = 0;
  Object.assign(game, { state: 'play', score: 0, lives: 3, combo: 0, comboT: 0, eaten: 0, playTime: 0, tier: 0,
    sharkT: rand(32, 40), pearlT: rand(14, 20), slowT: 0, shake: 0, dieT: 0, hints: {} });
  const s = findStart();
  Object.assign(player, { x: s.x, y: s.y, vx: 0, vy: 0, r: 12, face: 1, faceS: 1, tilt: 0, mouth: 0, chomp: 0,
    invuln: 2, stamina: 1, tired: false, dashing: false, active: true, alive: true, shield: 0, stun: 0, stungCool: 0 });
  zoom = zoomFor(player.r);
  cam.x = player.x; cam.y = player.y;
  for (let i = 0; i < 70; i++) spawnOne(true);
  ui.menu.classList.add('hidden'); ui.over.classList.add('hidden'); ui.pause.classList.add('hidden');
  ui.hud.classList.add('on');
  for (const k in cache) delete cache[k];
  banner('EAT OR BE EATEN', 'Smaller fish are food · bigger fish are danger');
}

function togglePause(force) {
  if (game.state === 'play' && force !== false) { game.state = 'paused'; ui.pause.classList.remove('hidden'); }
  else if (game.state === 'paused' && force !== true) { game.state = 'play'; ui.pause.classList.add('hidden'); }
}

function gameOver() {
  game.state = 'over';
  player.active = false;
  const isBest = game.score > game.best;
  if (isBest) { game.best = game.score; localStorage.setItem('deepfeast.best', String(game.best)); }
  $('sScore').textContent = game.score.toLocaleString();
  $('sTier').textContent = TIERS[game.tier].name;
  $('sEaten').textContent = game.eaten;
  const s = Math.floor(game.playTime);
  $('sTime').textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  $('newBest').textContent = isBest && game.score > 0 ? '★ NEW BEST ★' : '';
  $('overTitle').textContent = pick(['Gobbled!', 'Chomped!', 'Fish Food!', 'Swallowed!']);
  $('bestOver').textContent = $('bestMenu').textContent = game.best.toLocaleString();
  ui.hud.classList.remove('on');
  ui.over.classList.remove('hidden');
  menuCam.x = cam.x;
}

function checkTier() {
  let t = 0;
  for (let i = 0; i < TIERS.length; i++) if (player.r >= TIERS[i].r) t = i;
  if (t > game.tier) {
    game.tier = t;
    const extra = game.lives < 5;
    if (extra) game.lives++;
    banner(`${TIERS[t].name.toUpperCase()}!`, TIERS[t].blurb + (extra ? '  +1 life' : ''), 'rgba(255,212,71,.9)');
    Sound.tierUp();
    addP({ type: 'ring', x: player.x, y: player.y, life: 0.8, max: 0.8, size: player.r * 5, col: 'rgba(255,220,120,' });
    sparkle(player.x, player.y, player.r, 26, '#ffe38a');
  }
}

function eatFish(i) {
  const f = fish[i];
  fish.splice(i, 1);
  const pr = player.r;
  player.chomp = 0.22;
  player.r = Math.sqrt(pr * pr + f.r * f.r * GROW);
  game.combo = game.comboT > 0 ? Math.min(game.combo + 1, 12) : 1;
  game.comboT = 1.8;
  const pts = Math.round((f.r * 1.5 + 5) * (f.kind === 'shark' ? 5 : 1)) * game.combo;
  game.score += pts;
  game.eaten++;
  burst(f.x, f.y, f.r, f.sp.c[0]);
  addText(f.x, f.y - f.r, `+${pts}`, game.combo > 1 ? '#ffd447' : '#ffffff', game.combo > 2 ? 28 : 22);
  if (game.combo === 5 || game.combo === 10) {
    banner(game.combo === 10 ? 'MEGA FRENZY!' : 'FEEDING FRENZY!', `×${game.combo} combo`, 'rgba(255,170,40,.9)');
  }
  Sound.chomp(f.r / pr, game.combo);
  game.shake = Math.max(game.shake, 2 + (f.r / pr) * 3);
  checkTier();
}

function killPlayer(killer) {
  player.alive = false;
  game.dieT = 1.5;
  game.lives--;
  if (killer) { killer.chomp = 0.5; killer.state = 'wander'; killer.cool = 6; }
  burst(player.x, player.y, player.r * 1.4, PLAYER_SP.c[0]);
  sparkle(player.x, player.y, player.r, 16, '#ffd447');
  game.shake = 16; game.slowT = 0.7; game.combo = 0; game.comboT = 0;
  Sound.hurt();
}

function respawn() {
  Object.assign(player, { alive: true, invuln: 3, stamina: 1, tired: false, vx: 0, vy: 0, stun: 0 });
  const sight = viewW();
  for (const f of fish) {
    if (f.r >= player.r * DANGER && Math.hypot(f.x - player.x, f.y - player.y) < sight) {
      f.state = f.kind === 'shark' ? 'leave' : 'wander';
      f.cool = 6;
      f.dir = f.x < player.x ? -1 : 1;
      if (f.kind === 'shark') { f.life = 0; f.leaveDir = f.dir; }
    }
  }
  banner(`${game.lives} ${game.lives === 1 ? 'LIFE' : 'LIVES'} LEFT`, 'Shake it off and keep feeding', 'rgba(80,240,220,.85)');
}

// ============================================================ input
const input = { px: 0, py: 0, pointer: false, down: false, keys: {}, kb: false, touchDash: false };
cvs.addEventListener('pointermove', (e) => {
  input.px = e.clientX; input.py = e.clientY;
  if (e.pointerType === 'mouse' || e.buttons) { input.pointer = true; input.kb = false; }
});
cvs.addEventListener('pointerdown', (e) => {
  Sound.init();
  input.px = e.clientX; input.py = e.clientY; input.pointer = true; input.kb = false;
  if (e.pointerType === 'mouse') input.down = true;
  else document.body.classList.add('touch');
});
window.addEventListener('pointerup', (e) => {
  if (e.pointerType === 'mouse') input.down = false;
  else if (e.target === cvs) input.pointer = false;
});
const dashBtn = $('dashBtn');
dashBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); input.touchDash = true; });
dashBtn.addEventListener('pointerup', () => { input.touchDash = false; });
dashBtn.addEventListener('pointerleave', () => { input.touchDash = false; });

const MOVE_KEYS = ['arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'w', 'a', 's', 'd'];
window.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  input.keys[k] = true;
  if (MOVE_KEYS.includes(k)) input.kb = true;
  if (k === ' ' || k.startsWith('arrow')) e.preventDefault();
  if (k === 'p' || k === 'escape') togglePause();
  if (k === 'm') toggleMute();
  if (k === 'enter' && (game.state === 'menu' || game.state === 'over')) startGame();
});
window.addEventListener('keyup', (e) => { input.keys[e.key.toLowerCase()] = false; });
window.addEventListener('blur', () => { input.keys = {}; input.down = false; togglePause(true); });
document.addEventListener('visibilitychange', () => { if (document.hidden) togglePause(true); });

function toggleMute() {
  Sound.setMuted(!Sound.muted);
  $('muteBtn').textContent = Sound.muted ? '✕' : '♪';
}
$('muteBtn').textContent = Sound.muted ? '✕' : '♪';
$('muteBtn').addEventListener('click', toggleMute);
$('playBtn').addEventListener('click', startGame);
$('againBtn').addEventListener('click', startGame);
$('resumeBtn').addEventListener('click', () => togglePause(false));
$('bestMenu').textContent = game.best.toLocaleString();

// ============================================================ update
function animateFish(f, dt) {
  const sp = Math.hypot(f.vx, f.vy);
  if (f.vx > 6) f.face = 1; else if (f.vx < -6) f.face = -1;
  f.faceS += (f.face - f.faceS) * Math.min(1, dt * 9);
  const tilt = clamp(Math.atan2(f.vy, Math.abs(f.vx) + 1e-3), -1.05, 1.05);
  f.tilt += (tilt - f.tilt) * Math.min(1, dt * 6);
  f.wag += dt * clamp(3.5 + (sp / f.r) * 0.55, 3.5, 20);
  f.chomp = Math.max(0, f.chomp - dt);
  f.mouth += ((f.chomp > 0 ? 1 : 0) - f.mouth) * Math.min(1, dt * 16);
}

function updatePlayer(dt) {
  const base = speedFor(player.r);
  player.invuln = Math.max(0, player.invuln - dt);
  player.shield = Math.max(0, player.shield - dt);
  player.stun = Math.max(0, player.stun - dt);
  player.stungCool = Math.max(0, player.stungCool - dt);
  player.chomp = Math.max(0, player.chomp - dt);

  let dx = 0, dy = 0, mag = 0;
  const K = input.keys;
  if (input.kb) {
    dx = (K.arrowright || K.d ? 1 : 0) - (K.arrowleft || K.a ? 1 : 0);
    dy = (K.arrowdown || K.s ? 1 : 0) - (K.arrowup || K.w ? 1 : 0);
    const n = Math.hypot(dx, dy);
    if (n) { dx /= n; dy /= n; mag = 1; }
  } else if (input.pointer) {
    const sx = (player.x - cam.x) * zoom + W / 2, sy = (player.y - cam.y) * zoom + H / 2;
    const ddx = input.px - sx, ddy = input.py - sy, d = Math.hypot(ddx, ddy);
    if (d > 6) { dx = ddx / d; dy = ddy / d; mag = clamp((d - 6) / 110, 0, 1); }
  }

  const want = (K[' '] || K.shift || input.down || input.touchDash) && mag > 0.2;
  if (player.tired && player.stamina > 0.35) player.tired = false;
  const wasDashing = player.dashing;
  player.dashing = want && !player.tired && player.stun <= 0;
  if (player.dashing) {
    player.stamina -= dt * 0.85;
    if (player.stamina <= 0) { player.stamina = 0; player.tired = true; player.dashing = false; }
    if (Math.random() < dt * 30) bubble(player.x - player.face * player.r, player.y + rand(-0.4, 0.4) * player.r, player.r * 0.18, -rand(0.5, 1.5) * player.r);
  } else {
    player.stamina = Math.min(1, player.stamina + dt * 0.3);
  }
  if (player.dashing && !wasDashing) Sound.dash();

  const spd = base * mag * (player.dashing ? 1.85 : 1) * (player.stun > 0 ? 0.3 : 1);
  const k = Math.min(1, dt * (player.dashing ? 9 : 6));
  player.vx += (dx * spd - player.vx) * k;
  player.vy += (dy * spd - player.vy) * k;
  player.x = clamp(player.x + player.vx * dt, player.r, WORLD.w - player.r);
  const fy = floorY(player.x);
  player.y = clamp(player.y + player.vy * dt, player.r * 0.4, fy - player.r * 0.6);

  // mouth opens when prey is close in front
  let open = 0;
  for (const f of fish) {
    if (f.r > player.r * EAT) continue;
    const ox = f.x - player.x, oy = f.y - player.y;
    if (ox * player.face < -player.r * 0.3) continue;
    if (Math.hypot(ox, oy) < (player.r + f.r) * 2.3) { open = 1; break; }
  }
  player.blinkT -= dt;
  if (player.blinkT < 0) { player.blink = 0.12; player.blinkT = rand(2.5, 5); }
  player.blink = Math.max(0, player.blink - dt);

  animateFish(player, dt);
  const target = player.chomp > 0 ? 0.15 : open ? 1 : 0;
  player.mouth += (target - player.mouth) * Math.min(1, dt * 14);

  // collisions with fish
  const pr = player.r;
  for (let i = fish.length - 1; i >= 0; i--) {
    const f = fish[i];
    const ox = f.x - player.x, oy = f.y - player.y, d = Math.hypot(ox, oy);
    if (d > pr + f.r) continue;
    const ratio = f.r / pr;
    if (ratio <= EAT) {
      if (d < (pr + f.r * 0.5) * 0.9) eatFish(i);
    } else if (ratio >= DANGER) {
      if (d < pr * 0.55 + f.r * 0.72) {
        if (player.shield > 0 || player.invuln > 0) {
          const nx = ox / (d || 1), ny = oy / (d || 1);
          player.vx -= nx * base * 1.2; player.vy -= ny * base * 1.2;
          f.vx += nx * base * 0.6; f.vy += ny * base * 0.6;
          if (player.shield > 0 && f.bumpT !== Math.floor(time * 4)) { f.bumpT = Math.floor(time * 4); Sound.bump(); }
        } else {
          killPlayer(f);
          return;
        }
      }
    } else if (d < (pr + f.r) * 0.8) {
      const nx = ox / (d || 1), ny = oy / (d || 1), push = ((pr + f.r) * 0.8 - d) * 0.5;
      player.x -= nx * push; player.y -= ny * push; f.x += nx * push; f.y += ny * push;
    }
  }

  // jellyfish stings
  for (const j of jellies) {
    if (player.stungCool > 0 || player.shield > 0 || player.invuln > 0) break;
    const d1 = Math.hypot(j.x - player.x, j.y - player.y);
    const d2 = Math.hypot(j.x - player.x, j.y + j.r * 1.4 - player.y);
    if (d1 < pr * 0.7 + j.r * 0.85 || d2 < pr * 0.7 + j.r * 0.55) {
      player.stun = 1.1; player.stungCool = 2.2; player.stamina = 0; player.tired = true;
      const nx = (player.x - j.x) / (d1 || 1), ny = (player.y - j.y) / (d1 || 1);
      player.vx = nx * base * 1.4; player.vy = ny * base * 1.4;
      sparkle(player.x, player.y, pr, 14, `hsl(${j.hue},100%,75%)`);
      addText(player.x, player.y - pr * 1.4, 'ZAP!', '#ff9cf0', 26);
      game.shake = Math.max(game.shake, 7);
      Sound.zap();
      hint('jelly', 'OUCH!', 'Jellyfish sting at any size — swim around them', 'rgba(255,120,230,.9)');
    }
  }

  // pearls
  for (let i = pearls.length - 1; i >= 0; i--) {
    const p = pearls[i];
    if (Math.hypot(p.x - player.x, p.y - player.y) < pr + p.r) {
      pearls.splice(i, 1);
      player.shield = 7; player.stamina = 1; player.tired = false;
      const pts = 100 * (game.tier + 1);
      game.score += pts;
      addText(p.x, p.y - p.r * 2, `SHIELD +${pts}`, '#bff6ff', 24);
      sparkle(p.x, p.y, pr, 22, '#ffffff');
      addP({ type: 'ring', x: p.x, y: p.y, life: 0.6, max: 0.6, size: pr * 3, col: 'rgba(190,250,255,' });
      Sound.pearl();
      hint('pearl', 'BUBBLE SHIELD', 'Predators bounce off you for a few seconds', 'rgba(140,240,255,.9)');
    }
  }
}

function updateFish(dt) {
  const pr = focusR(), base = speedFor(pr);
  const active = playing();
  const sight = Math.min(viewW(), viewH()) * 0.62;

  for (const s of schools) { s.cx = 0; s.cy = 0; s.n = 0; s.vx = 0; }
  for (const f of fish) if (f.school) { f.school.cx += f.x; f.school.cy += f.y; f.school.vx += f.vx; f.school.n++; }
  schools = schools.filter((s) => s.n > 0);
  for (const s of schools) {
    s.cx /= s.n; s.cy /= s.n;
    s.fleeT = Math.max(0, s.fleeT - dt);
    s.turnT -= dt;
    if (s.fleeT <= 0 && s.wasFleeing) { s.dir = s.vx >= 0 ? 1 : -1; }
    s.wasFleeing = s.fleeT > 0;
    if (s.turnT <= 0) { s.turnT = rand(7, 15); if (Math.random() < 0.4) s.dir *= -1; }
    if (s.cx < 300) s.dir = 1; else if (s.cx > WORLD.w - 300) s.dir = -1;
  }

  for (const f of fish) {
    f.cool = Math.max(0, f.cool - dt);
    f.alertT = Math.max(0, f.alertT - dt);
    f.eatCool = Math.max(0, f.eatCool - dt);
    const dx = player.x - f.x, dy = player.y - f.y, d = Math.hypot(dx, dy) || 1;
    const ratio = f.r / pr;
    let tx, ty, spd, agility;

    if (f.kind === 'shark') {
      f.life -= dt;
      const prey = ratio <= EAT;
      if (f.life > 0 && active && !prey) {
        const lead = Math.min(d / base, 0.5);
        const ax = player.x + player.vx * lead - f.x, ay = player.y + player.vy * lead - f.y, ad = Math.hypot(ax, ay) || 1;
        tx = ax / ad; ty = ay / ad; spd = base * 1.08; agility = 1.7; f.state = 'chase';
      } else if (f.life > 0 && active && prey) {
        tx = -dx / d; ty = -dy / d * 0.7; spd = base * 0.82; agility = 2.4; f.state = 'flee';
      } else {
        f.state = 'leave';
        tx = f.leaveDir; ty = -0.15; spd = base * 1.1; agility = 1.5;
      }
    } else {
      if (active && ratio >= DANGER && f.state !== 'chase' && f.cool <= 0 && d < sight &&
          player.invuln <= 0 && player.shield <= 0 && Math.random() < dt * 0.7 * f.aggro) {
        f.state = 'chase'; f.chaseT = rand(3, 5.5); f.alertT = 1.1;
        Sound.alert();
        hint('pred', 'WATCH OUT!', 'Bigger fish will hunt you — outswim them or dash', 'rgba(255,80,90,.9)');
      }
      if (f.state === 'chase') {
        f.chaseT -= dt;
        if (!active || ratio < DANGER || player.invuln > 0 || player.shield > 0 || f.chaseT <= 0 || d > sight * 1.7) {
          f.state = 'wander'; f.cool = rand(4, 8); f.dir = f.vx >= 0 ? 1 : -1;
        }
      }
      const fleeing = active && ratio <= EAT && d < sight * 0.5;
      if (f.state === 'chase') {
        const lead = Math.min(d / base, 0.6);
        const ax = player.x + player.vx * lead - f.x, ay = player.y + player.vy * lead - f.y, ad = Math.hypot(ax, ay) || 1;
        tx = ax / ad; ty = ay / ad; spd = base * 0.86; agility = 2.1;
      } else if (fleeing || (f.school && f.school.fleeT > 0)) {
        if (fleeing && f.school) f.school.fleeT = 0.8;
        tx = -dx / d + Math.sin(time * 3 + f.phase) * 0.35;
        ty = (-dy / d) * 0.8 + Math.cos(time * 2.3 + f.phase) * 0.25;
        spd = base * (f.school ? 0.68 : 0.6); agility = 3.2;
        f.dir = tx >= 0 ? 1 : -1;
      } else if (f.school) {
        const s = f.school;
        tx = s.dir + (s.cx + f.slotX - f.x) / (f.r * 10);
        ty = (s.cy + f.slotY - f.y) / (f.r * 10) + Math.sin(time * 1.1 + s.cx * 0.001) * 0.2;
        spd = base * f.cruise; agility = 2.2;
      } else {
        f.homeT -= dt;
        if (f.homeT <= 0) {
          f.homeT = rand(3, 8);
          f.homeY = clamp(f.y + rand(-1, 1) * f.r * 14, 90 + f.r, floorY(f.x) - f.r - 40);
          if (Math.random() < 0.12) f.dir *= -1;
        }
        tx = f.dir;
        ty = clamp((f.homeY - f.y) / (f.r * 20), -0.4, 0.4) + Math.sin(time * 0.9 + f.phase) * 0.12;
        spd = base * f.cruise; agility = 1.5;
      }
    }

    if (f.kind !== 'shark' || f.state !== 'leave') {
      if (f.x < 160) { f.dir = 1; tx = Math.abs(tx) + 0.6; }
      else if (f.x > WORLD.w - 160) { f.dir = -1; tx = -Math.abs(tx) - 0.6; }
    }
    const fy = floorY(f.x);
    if (f.y < 70 + f.r) ty = Math.abs(ty) + 0.4;
    else if (f.y > fy - f.r - 30) ty = -Math.abs(ty) - 0.4;
    const tn = Math.hypot(tx, ty) || 1;
    const k = Math.min(1, dt * agility);
    f.vx += ((tx / tn) * spd - f.vx) * k;
    f.vy += ((ty / tn) * spd - f.vy) * k;
    f.x += f.vx * dt; f.y += f.vy * dt;
    f.y = clamp(f.y, 30 + f.r * 0.5, floorY(f.x) - f.r * 0.6);
    animateFish(f, dt);
  }

  // the food chain runs without you, too (only on screen so you can see it)
  const vx0 = cam.x - viewW() / 2, vx1 = cam.x + viewW() / 2;
  for (let i = 0; i < fish.length; i++) {
    const a = fish[i];
    if (a.school || a.eatCool > 0 || a.x < vx0 || a.x > vx1) continue;
    for (let j = fish.length - 1; j >= 0; j--) {
      const b = fish[j];
      if (b === a || b.kind === 'shark' || a.r < b.r * 1.45) continue;
      if (Math.hypot(a.x - b.x, a.y - b.y) < (a.r + b.r) * 0.55) {
        fish.splice(j, 1);
        if (j < i) i--;
        a.chomp = 0.3; a.eatCool = rand(3, 6);
        burst(b.x, b.y, b.r * 0.8, b.sp.c[0]);
        break;
      }
    }
  }
}

function updateJellies(dt) {
  for (const j of jellies) {
    j.phase += dt * j.pf;
    const pulse = Math.sin(j.phase);
    const target = pulse > 0.55 ? -j.r * 1.7 : j.r * 0.22;
    j.vy += (target - j.vy) * Math.min(1, dt * 2.2);
    j.x += j.vx * dt; j.y += j.vy * dt;
    j.y = clamp(j.y, 500, floorY(j.x) - j.r * 3.5);
  }
}

function updateSpawner(dt) {
  const vw = viewW(), vh = viewH();
  for (let i = fish.length - 1; i >= 0; i--) {
    const f = fish[i];
    const far = Math.abs(f.x - cam.x) > vw * 1.1 + f.r * 3 || Math.abs(f.y - cam.y) > vh * 1.15 + f.r * 3;
    if (far && !(f.kind === 'shark' && f.life > 0)) fish.splice(i, 1);
  }
  for (let i = jellies.length - 1; i >= 0; i--) {
    const j = jellies[i];
    if (Math.abs(j.x - cam.x) > vw * 1.4 || Math.abs(j.y - cam.y) > vh * 1.6) jellies.splice(i, 1);
  }
  for (let i = pearls.length - 1; i >= 0; i--) { pearls[i].life -= dt; if (pearls[i].life <= 0) pearls.splice(i, 1); }
  for (let n = 0; n < 3 && fish.length < 78; n++) spawnOne(false);
  const jTarget = cam.y > 900 ? 4 : 2;
  if (jellies.length < jTarget && Math.random() < dt * 0.5) spawnJelly();

  // ambient vent bubbles from the sea floor
  if (Math.random() < dt * 6) {
    const x = cam.x + rand(-0.5, 0.5) * vw, fy = floorY(x);
    if (fy < cam.y + vh / 2) bubble(x, fy - 4, rand(2, 5) / zoom, -rand(25, 60) / zoom);
  }
}

function updateEvents(dt) {
  game.playTime += dt;
  game.comboT = Math.max(0, game.comboT - dt);
  if (game.comboT <= 0) game.combo = 0;
  if (!player.alive) {
    game.dieT -= dt;
    if (game.dieT <= 0) { if (game.lives > 0) respawn(); else gameOver(); }
    return;
  }
  game.sharkT -= dt;
  if (game.sharkT <= 0) {
    if (!fish.some((f) => f.kind === 'shark')) spawnShark();
    game.sharkT = rand(35, 55);
  }
  game.pearlT -= dt;
  if (game.pearlT <= 0) { if (!pearls.length) spawnPearl(); game.pearlT = rand(24, 38); }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    if (p.type === 'bubble') {
      p.ph += dt * 4;
      p.x += (p.vx + Math.sin(p.ph) * p.size * 1.5) * dt; p.y += p.vy * dt;
      if (p.y < 0) p.life = 0;
    } else if (p.type === 'bit' || p.type === 'spark') {
      p.vx *= 1 - dt * 2.5; p.vy *= 1 - dt * 2.5;
      if (p.type === 'bit') p.vy += p.size * 6 * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
    }
  }
  for (let i = texts.length - 1; i >= 0; i--) { texts[i].life -= dt; if (texts[i].life <= 0) texts.splice(i, 1); }
}

function updateCamera(dt) {
  const tz = player.active ? zoomFor(player.r) : zoomFor(22);
  zoom += (tz - zoom) * Math.min(1, dt * 1.6);
  let fx, fy;
  if (player.active) {
    fx = player.x + player.vx * 0.3; fy = player.y + player.vy * 0.2;
  } else {
    menuCam.x += menuCam.dir * 70 * dt;
    if (menuCam.x > WORLD.w - 1500) menuCam.dir = -1; else if (menuCam.x < 1500) menuCam.dir = 1;
    fx = menuCam.x; fy = floorY(menuCam.x) - 480;
  }
  const k = Math.min(1, dt * (player.active ? 4 : 1.2));
  cam.x += (fx - cam.x) * k; cam.y += (fy - cam.y) * k;
  const hw = W / 2 / zoom, hh = H / 2 / zoom;
  cam.x = clamp(cam.x, hw, WORLD.w - hw);
  cam.y = clamp(cam.y, hh - Math.min(170, hh * 0.28), WORLD.h - hh);
  game.shake *= Math.exp(-dt * 7);
}

function update(dt) {
  time += dt;
  if (game.state === 'play') {
    if (player.alive) updatePlayer(dt);
    updateEvents(dt);
  }
  updateFish(dt);
  updateJellies(dt);
  updateSpawner(dt);
  updateParticles(dt);
  updateCamera(dt);
  if (game.state === 'play') updateHUD();
}

// ============================================================ drawing: fish
function bodyPath(hl, hh, sh, bend) {
  const ped = sh.ped;
  ctx.beginPath();
  ctx.moveTo(hl, 0);
  ctx.bezierCurveTo(hl * sh.nx, -hh * sh.ny, -hl * 0.3, -hh * 1.12 + bend * 0.3, -hl * 0.86, -hh * ped + bend);
  ctx.lineTo(-hl * 0.86, hh * ped + bend);
  ctx.bezierCurveTo(-hl * 0.3, hh * 1.12 + bend * 0.3, hl * sh.nx, hh * sh.ny, hl, 0);
  ctx.closePath();
}

function drawTail(sh, hl, hh, col) {
  const tl = hl * sh.tl, th = hl * sh.tH;
  ctx.fillStyle = col;
  ctx.beginPath();
  if (sh.tail === 'fork') {
    ctx.moveTo(hl * 0.08, -hh * 0.2);
    ctx.quadraticCurveTo(-tl * 0.45, -th * 0.45, -tl, -th);
    ctx.quadraticCurveTo(-tl * 0.6, -th * 0.15, -tl * 0.5, 0);
    ctx.quadraticCurveTo(-tl * 0.6, th * 0.15, -tl, th);
    ctx.quadraticCurveTo(-tl * 0.45, th * 0.45, hl * 0.08, hh * 0.2);
  } else if (sh.tail === 'lunate') {
    ctx.moveTo(hl * 0.06, -hh * 0.14);
    ctx.quadraticCurveTo(-tl * 0.5, -th * 0.25, -tl, -th);
    ctx.quadraticCurveTo(-tl * 0.5, -th * 0.2, -tl * 0.36, 0);
    ctx.quadraticCurveTo(-tl * 0.5, th * 0.2, -tl, th);
    ctx.quadraticCurveTo(-tl * 0.5, th * 0.25, hl * 0.06, hh * 0.14);
  } else if (sh.tail === 'fan') {
    ctx.moveTo(hl * 0.06, -hh * 0.22);
    ctx.lineTo(-tl * 0.85, -th);
    ctx.quadraticCurveTo(-tl * 1.3, 0, -tl * 0.85, th);
    ctx.lineTo(hl * 0.06, hh * 0.22);
  } else {
    ctx.moveTo(hl * 0.06, -hh * 0.16);
    ctx.quadraticCurveTo(-tl * 0.5, -th * 0.45, -tl, -th);
    ctx.quadraticCurveTo(-tl * 0.62, -th * 0.2, -tl * 0.44, hh * 0.08);
    ctx.quadraticCurveTo(-tl * 0.56, th * 0.3, -tl * 0.62, th * 0.58);
    ctx.quadraticCurveTo(-tl * 0.3, th * 0.22, hl * 0.06, hh * 0.16);
  }
  ctx.closePath();
  ctx.fill();
}

function drawFins(sh, hl, hh, w, col) {
  const dH = hl * sh.dH, aH = hl * sh.aH;
  ctx.fillStyle = col;
  ctx.beginPath();
  if (sh.tail === 'shark') {
    ctx.moveTo(hl * 0.22, -hh * 0.6);
    ctx.quadraticCurveTo(hl * 0.04, -hh * 0.9 - dH * 0.6, -hl * 0.14, -hh * 0.75 - dH);
    ctx.quadraticCurveTo(-hl * 0.1, -hh * 0.85, -hl * 0.3, -hh * 0.55);
    ctx.moveTo(-hl * 0.62, -hh * 0.3);
    ctx.lineTo(-hl * 0.7, -hh * 0.3 - dH * 0.22);
    ctx.lineTo(-hl * 0.76, -hh * 0.25);
  } else if (sh.trailing) {
    ctx.moveTo(hl * 0.3, -hh * 0.6);
    ctx.quadraticCurveTo(hl * 0.0, -hh * 0.8 - dH, -hl * 0.95 + w * hl * 0.25, -hh * 0.6 - dH * 1.15);
    ctx.quadraticCurveTo(-hl * 0.55, -hh * 0.6, -hl * 0.7, -hh * 0.25);
    ctx.moveTo(hl * 0.1, hh * 0.6);
    ctx.quadraticCurveTo(-hl * 0.1, hh * 0.8 + aH, -hl * 0.95 + w * hl * 0.25, hh * 0.6 + aH * 1.15);
    ctx.quadraticCurveTo(-hl * 0.55, hh * 0.6, -hl * 0.7, hh * 0.25);
  } else {
    ctx.moveTo(hl * 0.28, -hh * 0.6);
    ctx.quadraticCurveTo(hl * 0.05, -hh * 0.8 - dH * 1.3, -hl * 0.4, -hh * 0.7 - dH);
    ctx.quadraticCurveTo(-hl * 0.5, -hh * 0.7, -hl * 0.62, -hh * 0.35);
    ctx.moveTo(-hl * 0.1, hh * 0.6);
    ctx.quadraticCurveTo(-hl * 0.3, hh * 0.75 + aH * 1.2, -hl * 0.55, hh * 0.6 + aH);
    ctx.quadraticCurveTo(-hl * 0.6, hh * 0.55, -hl * 0.68, hh * 0.3);
  }
  ctx.fill();
}

function drawPattern(f, sp, hl, hh) {
  switch (sp.pat) {
    case 'line':
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.fillRect(-hl, -hh * 0.12, hl * 2, hh * 0.16);
      ctx.fillStyle = 'rgba(40,80,140,0.35)';
      ctx.fillRect(-hl, -hh, hl * 2, hh * 0.45);
      break;
    case 'bands':
      for (const bx of [hl * 0.42, -hl * 0.12, -hl * 0.64]) {
        const bw = hl * 0.17;
        ctx.fillStyle = '#1b1210';
        ctx.beginPath(); ctx.ellipse(bx, 0, bw * 0.75, hh * 1.3, 0.08, 0, TAU); ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.ellipse(bx, 0, bw * 0.5, hh * 1.3, 0.08, 0, TAU); ctx.fill();
      }
      break;
    case 'tang':
      ctx.strokeStyle = '#0a1638';
      ctx.lineWidth = hh * 0.26;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(hl * 0.42, -hh * 0.4);
      ctx.quadraticCurveTo(-hl * 0.1, -hh * 0.05, -hl * 0.55, -hh * 0.55);
      ctx.moveTo(-hl * 0.05, -hh * 0.2);
      ctx.quadraticCurveTo(-hl * 0.4, hh * 0.35, -hl * 0.75, hh * 0.05);
      ctx.stroke();
      break;
    case 'stripes':
      ctx.fillStyle = 'rgba(30,30,30,0.85)';
      for (const bx of [hl * 0.35, -hl * 0.1, -hl * 0.55]) {
        ctx.save(); ctx.translate(bx, 0); ctx.rotate(0.25);
        ctx.fillRect(-hl * 0.05, -hh * 1.5, hl * 0.1, hh * 3);
        ctx.restore();
      }
      break;
    case 'spots':
      ctx.fillStyle = sp.spot;
      ctx.globalAlpha = 0.75;
      ctx.beginPath();
      for (const s of f.spots) { ctx.moveTo(s[0] * hl + s[2] * hl, s[1] * hh); ctx.arc(s[0] * hl, s[1] * hh, s[2] * hl, 0, TAU); }
      ctx.fill();
      ctx.globalAlpha = 1;
      break;
    case 'scales': {
      ctx.strokeStyle = 'rgba(0,60,60,0.25)';
      ctx.lineWidth = hl * 0.025;
      const st = hl * 0.16;
      ctx.beginPath();
      for (let x = -hl * 0.8; x < hl * 0.5; x += st) {
        for (let y = -hh; y < hh; y += st * 0.8) {
          const ox = (Math.round(y / (st * 0.8)) & 1) * st * 0.5;
          ctx.moveTo(x + ox + st * 0.5, y); ctx.arc(x + ox, y, st * 0.5, 0, Math.PI * 0.9);
        }
      }
      ctx.stroke();
      ctx.fillStyle = 'rgba(255,120,200,0.55)';
      ctx.beginPath(); ctx.ellipse(hl * 0.72, hh * 0.15, hl * 0.22, hh * 0.35, 0, 0, TAU); ctx.fill();
      break;
    }
    case 'bars':
      ctx.fillStyle = 'rgba(40,55,70,0.32)';
      for (let i = 0; i < 9; i++) ctx.fillRect(hl * 0.45 - i * hl * 0.15, -hh, hl * 0.07, hh * 0.95);
      break;
    case 'finlets':
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      ctx.fillRect(-hl, hh * 0.05, hl * 2, hh * 0.12);
      break;
    case 'player':
      ctx.strokeStyle = '#ffd447';
      ctx.lineWidth = hh * 0.17;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(hl * 0.5, -hh * 0.52);
      ctx.quadraticCurveTo(-hl * 0.1, -hh * 0.3, -hl * 0.88, -hh * 0.05);
      ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.beginPath();
      for (const [sx, sy, sr] of [[-0.2, 0.25, 0.05], [-0.45, 0.1, 0.04], [0.05, 0.38, 0.035]]) {
        ctx.moveTo(sx * hl + sr * hl, sy * hh); ctx.arc(sx * hl, sy * hh, sr * hl, 0, TAU);
      }
      ctx.fill();
      break;
    case 'shark':
      break;
  }
}

function drawFish(f, isPlayer) {
  const sp = f.sp, sh = SHAPES[sp.shape];
  const hl = f.r * 1.3, hh = hl * sh.hh;
  const w = Math.sin(f.wag) * 0.3;
  const bend = w * hh * 0.45;
  const lw = Math.max(0.9 / zoom, hl * 0.03);
  let fs = f.faceS;
  if (Math.abs(fs) < 0.06) fs = fs < 0 ? -0.06 : 0.06;

  ctx.save();
  ctx.translate(f.x, f.y);
  ctx.scale(fs, 1);
  ctx.rotate(f.tilt);

  // tail
  ctx.save();
  ctx.translate(-hl * 0.84, bend);
  ctx.rotate(w * 1.3);
  drawTail(sh, hl, hh, sp.tailCol || sp.fin);
  ctx.restore();
  drawFins(sh, hl, hh, w, sp.fin);

  // body
  const g = ctx.createLinearGradient(0, -hh, 0, hh);
  g.addColorStop(0, sp.c[1]); g.addColorStop(0.45, sp.c[0]); g.addColorStop(1, sp.c[2]);
  bodyPath(hl, hh, sh, bend);
  ctx.fillStyle = g;
  ctx.fill();

  ctx.save();
  ctx.clip();
  drawPattern(f, sp, hl, hh);
  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  ctx.beginPath(); ctx.ellipse(hl * 0.05, -hh * 0.5, hl * 0.55, hh * 0.17, -0.05, 0, TAU); ctx.fill();
  if (f.mouth > 0.04) {
    const m = f.mouth;
    ctx.fillStyle = '#3b0d16';
    ctx.beginPath();
    ctx.moveTo(hl * 1.05, -hh * 0.42 * m);
    ctx.lineTo(hl * (0.92 - 0.3 * m), hh * 0.05);
    ctx.lineTo(hl * 1.05, hh * 0.42 * m);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();

  bodyPath(hl, hh, sh, bend);
  ctx.lineWidth = lw;
  ctx.strokeStyle = 'rgba(0,18,36,0.38)';
  ctx.stroke();

  // gills
  ctx.strokeStyle = 'rgba(0,0,0,0.22)';
  ctx.lineWidth = lw * 0.9;
  ctx.beginPath();
  if (sh.tail === 'shark') {
    for (let i = 0; i < 4; i++) { const gx = hl * (0.4 - i * 0.06); ctx.moveTo(gx, -hh * 0.35); ctx.quadraticCurveTo(gx - hl * 0.03, 0, gx, hh * 0.3); }
  } else {
    ctx.arc(hl * 0.62, 0, hl * 0.28, Math.PI * 0.72, Math.PI * 1.28);
  }
  ctx.stroke();

  // pectoral fin
  ctx.save();
  if (sh.tail === 'shark') {
    ctx.translate(hl * 0.3, hh * 0.55);
    ctx.fillStyle = sp.fin;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-hl * 0.32, hh * 1.3); ctx.lineTo(-hl * 0.18, 0); ctx.closePath(); ctx.fill();
  } else {
    ctx.translate(hl * 0.22, hh * 0.25);
    ctx.rotate(0.6 + Math.sin(f.wag * 1.3) * 0.35);
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = sp.fin;
    ctx.beginPath(); ctx.ellipse(-hl * 0.12, 0, hl * 0.17, Math.max(hh * 0.12, 0.5), 0, 0, TAU); ctx.fill();
  }
  ctx.restore();

  // eye
  const ex = hl * (sh.tail === 'shark' ? 0.62 : 0.56), ey = -hh * 0.22;
  const er = Math.max(hl * (sp.eye || sh.eye), 1.1);
  const angry = f.state === 'chase';
  if (isPlayer && f.blink > 0) {
    ctx.strokeStyle = '#0b0f14'; ctx.lineWidth = er * 0.35;
    ctx.beginPath(); ctx.moveTo(ex - er, ey); ctx.lineTo(ex + er, ey); ctx.stroke();
  } else if (isPlayer && f.chomp > 0) {
    ctx.strokeStyle = '#0b0f14'; ctx.lineWidth = er * 0.38; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(ex - er * 0.9, ey + er * 0.3); ctx.lineTo(ex, ey - er * 0.5); ctx.lineTo(ex + er * 0.9, ey + er * 0.3); ctx.stroke();
  } else {
    ctx.fillStyle = sh.tail === 'shark' ? '#0d1116' : '#ffffff';
    ctx.beginPath(); ctx.arc(ex, ey, er, 0, TAU); ctx.fill();
    if (sh.tail !== 'shark') {
      if (angry) { ctx.fillStyle = '#e0283c'; ctx.beginPath(); ctx.arc(ex + er * 0.22, ey, er * 0.66, 0, TAU); ctx.fill(); }
      ctx.fillStyle = '#0b0f14';
      ctx.beginPath(); ctx.arc(ex + er * 0.25, ey, er * (angry ? 0.36 : 0.6), 0, TAU); ctx.fill();
    }
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(ex + er * 0.05, ey - er * 0.32, er * 0.26, 0, TAU); ctx.fill();
  }
  if (angry) {
    ctx.strokeStyle = '#1a0d0d'; ctx.lineWidth = er * 0.45; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(ex - er * 1.3, ey - er * 1.7); ctx.lineTo(ex + er * 1.1, ey - er * 0.95); ctx.stroke();
  }
  ctx.restore();
}

// ============================================================ drawing: decor
function rockPath(r) {
  const pts = r.pts, n = pts.length;
  const P = (i) => { const [a, m] = pts[(i + n) % n]; return [r.x + Math.cos(a) * r.s * m * 1.25, r.y + Math.sin(a) * r.s * m * 0.8]; };
  ctx.beginPath();
  let [px, py] = P(0), [qx, qy] = P(1);
  ctx.moveTo((px + qx) / 2, (py + qy) / 2);
  for (let i = 1; i <= n; i++) {
    [px, py] = P(i); [qx, qy] = P(i + 1);
    ctx.quadraticCurveTo(px, py, (px + qx) / 2, (py + qy) / 2);
  }
  ctx.closePath();
}

function drawDecorItem(d) {
  switch (d.type) {
    case 'kelp': {
      const segs = 16, sl = d.h / segs;
      const L = [], R = [];
      let x = d.x, y = d.y, ang = -Math.PI / 2;
      const pts = [[x, y]];
      for (let i = 1; i <= segs; i++) {
        ang = -Math.PI / 2 + Math.sin(time * 0.8 + d.phase + i * 0.32) * 0.16 * (0.3 + i / segs);
        x += Math.cos(ang) * sl; y += Math.sin(ang) * sl;
        pts.push([x, y]);
      }
      for (let i = 0; i < pts.length; i++) {
        const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
        const nx = -(b[1] - a[1]), ny = b[0] - a[0], nl = Math.hypot(nx, ny) || 1;
        const hw = d.w * (1 - (i / segs) * 0.75) * 0.5;
        L.push([pts[i][0] + (nx / nl) * hw, pts[i][1] + (ny / nl) * hw]);
        R.push([pts[i][0] - (nx / nl) * hw, pts[i][1] - (ny / nl) * hw]);
      }
      const col = d.tone < 0.5 ? '#2e8b57' : '#4a9a3c';
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.moveTo(L[0][0], L[0][1]);
      for (const p of L) ctx.lineTo(p[0], p[1]);
      for (let i = R.length - 1; i >= 0; i--) ctx.lineTo(R[i][0], R[i][1]);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = d.tone < 0.5 ? '#3aa06a' : '#62b04e';
      ctx.beginPath();
      for (let i = 2; i < pts.length - 1; i += 2) {
        const s = i % 4 === 0 ? 1 : -1, rot = s * 0.6 + Math.sin(time * 1.2 + d.phase + i) * 0.25;
        const lx = pts[i][0] + s * d.w * 0.9, ly = pts[i][1];
        ctx.moveTo(lx + Math.cos(rot) * d.w * 1.1, ly + Math.sin(rot) * d.w * 1.1);
        ctx.ellipse(lx, ly, d.w * 1.1, d.w * 0.38, rot, 0, TAU);
      }
      ctx.fill();
      break;
    }
    case 'rock': {
      const c = d.tone < 0.5 ? ['#a3a9b4', '#5d6370', '#2b2f38'] : ['#b19d86', '#6c5c4c', '#332b24'];
      const g = ctx.createLinearGradient(d.x - d.s * 0.7, d.y - d.s, d.x + d.s * 0.5, d.y + d.s * 0.4);
      g.addColorStop(0, c[0]); g.addColorStop(0.5, c[1]); g.addColorStop(1, c[2]);
      rockPath(d);
      ctx.fillStyle = g; ctx.fill();
      ctx.lineWidth = Math.max(1 / zoom, d.s * 0.03);
      ctx.strokeStyle = 'rgba(8,14,24,0.4)'; ctx.stroke();
      ctx.save();
      ctx.clip();
      ctx.fillStyle = 'rgba(255,255,255,0.13)';
      ctx.beginPath(); ctx.ellipse(d.x - d.s * 0.4, d.y - d.s * 0.62, d.s * 0.55, d.s * 0.2, -0.25, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,0.16)';
      ctx.beginPath();
      for (let i = 0; i < 7; i++) {
        const sx = d.x + (hash(d.x + i * 3.3) - 0.5) * d.s * 1.8, sy = d.y - hash(d.x * 1.3 + i) * d.s * 0.7, sr = d.s * (0.04 + hash(d.x + i) * 0.06);
        ctx.moveTo(sx + sr, sy); ctx.arc(sx, sy, sr, 0, TAU);
      }
      ctx.fill();
      ctx.fillStyle = d.tone < 0.5 ? 'rgba(90,175,100,0.55)' : 'rgba(150,170,80,0.5)';
      ctx.beginPath(); ctx.ellipse(d.x - d.s * 0.05, d.y - d.s * 0.82, d.s * 0.75, d.s * 0.2, 0, 0, TAU); ctx.fill();
      ctx.restore();
      break;
    }
    case 'branch': {
      ctx.strokeStyle = d.col; ctx.lineCap = 'round';
      ctx.save(); ctx.translate(d.x, d.y);
      const sway = Math.sin(time * 0.7 + d.x * 0.01) * 0.02;
      ctx.rotate(sway);
      for (let l = 0; l < d.levels.length; l++) {
        ctx.lineWidth = d.s * 0.13 * Math.pow(0.7, l);
        ctx.beginPath();
        for (const s of d.levels[l]) { ctx.moveTo(s[0], s[1]); ctx.lineTo(s[2], s[3]); }
        ctx.stroke();
      }
      ctx.fillStyle = d.tip;
      ctx.beginPath();
      for (const s of d.levels[d.levels.length - 1]) { ctx.moveTo(s[2] + d.s * 0.035, s[3]); ctx.arc(s[2], s[3], d.s * 0.035, 0, TAU); }
      ctx.fill();
      ctx.restore();
      break;
    }
    case 'fan': {
      const sway = Math.sin(time * 0.6 + d.phase) * 0.05;
      ctx.save(); ctx.translate(d.x, d.y); ctx.rotate(sway);
      ctx.fillStyle = d.col; ctx.globalAlpha = 0.35;
      ctx.beginPath(); ctx.moveTo(0, 0);
      for (const [a, m] of d.ribs) ctx.lineTo(Math.cos(a) * d.s * m, Math.sin(a) * d.s * m);
      ctx.closePath(); ctx.fill();
      ctx.globalAlpha = 1; ctx.strokeStyle = d.col; ctx.lineWidth = d.s * 0.03;
      ctx.beginPath();
      for (const [a, m] of d.ribs) { ctx.moveTo(0, 0); ctx.quadraticCurveTo(Math.cos(a + 0.1) * d.s * m * 0.5, Math.sin(a + 0.1) * d.s * m * 0.5, Math.cos(a) * d.s * m, Math.sin(a) * d.s * m); }
      ctx.stroke();
      ctx.lineWidth = d.s * 0.015;
      ctx.beginPath();
      for (const k of [0.4, 0.62, 0.82]) ctx.arc(0, 0, d.s * k, -Math.PI + 0.4, -0.4);
      ctx.stroke();
      ctx.restore();
      break;
    }
    case 'brain': {
      const g = ctx.createRadialGradient(d.x - d.s * 0.2, d.y - d.s * 0.4, d.s * 0.05, d.x, d.y, d.s * 0.8);
      g.addColorStop(0, '#ffffff'); g.addColorStop(0.15, d.col); g.addColorStop(1, 'rgba(40,20,40,1)');
      ctx.save();
      ctx.beginPath(); ctx.ellipse(d.x, d.y, d.s * 0.7, d.s * 0.48, 0, Math.PI, TAU); ctx.closePath();
      ctx.fillStyle = g; ctx.fill(); ctx.clip();
      ctx.strokeStyle = 'rgba(0,0,0,0.22)'; ctx.lineWidth = d.s * 0.035;
      ctx.beginPath();
      for (let k = 0; k < 5; k++) {
        const yy = d.y - d.s * (0.08 + k * 0.09);
        ctx.moveTo(d.x - d.s * 0.7, yy);
        for (let xx = -0.7; xx <= 0.7; xx += 0.07) ctx.lineTo(d.x + xx * d.s, yy + Math.sin(xx * 18 + d.seed + k) * d.s * 0.025);
      }
      ctx.stroke();
      ctx.restore();
      break;
    }
    case 'tube': {
      for (const [dx, h, w] of d.tubes) {
        const x = d.x + dx;
        const g = ctx.createLinearGradient(x - w, 0, x + w, 0);
        g.addColorStop(0, d.col); g.addColorStop(0.5, '#ffffff55'); g.addColorStop(1, d.col);
        ctx.fillStyle = d.col;
        ctx.beginPath(); ctx.roundRect(x - w, d.y - h, w * 2, h, w * 0.6); ctx.fill();
        ctx.fillStyle = g; ctx.globalAlpha = 0.5; ctx.fill(); ctx.globalAlpha = 1;
        ctx.fillStyle = 'rgba(30,10,20,0.7)';
        ctx.beginPath(); ctx.ellipse(x, d.y - h + w * 0.25, w * 0.75, w * 0.3, 0, 0, TAU); ctx.fill();
      }
      break;
    }
    case 'anem': {
      const col = `hsl(${d.hue},${d.deep ? 90 : 75}%,${d.deep ? 65 : 62}%)`;
      ctx.fillStyle = `hsl(${d.hue},45%,35%)`;
      ctx.beginPath(); ctx.ellipse(d.x, d.y - d.s * 0.12, d.s * 0.32, d.s * 0.2, 0, 0, TAU); ctx.fill();
      ctx.strokeStyle = col; ctx.lineWidth = d.s * 0.07; ctx.lineCap = 'round';
      ctx.beginPath();
      const tips = [];
      for (let i = 0; i < d.n; i++) {
        const a = -Math.PI + 0.35 + (i / (d.n - 1)) * (Math.PI - 0.7);
        const sw = Math.sin(time * 1.4 + d.phase + i * 0.6) * 0.3;
        const ex = d.x + Math.cos(a + sw * 0.4) * d.s * 0.75, ey = d.y - d.s * 0.2 + Math.sin(a) * d.s * 0.75;
        ctx.moveTo(d.x + Math.cos(a) * d.s * 0.2, d.y - d.s * 0.2);
        ctx.quadraticCurveTo(d.x + Math.cos(a) * d.s * 0.5 + sw * d.s * 0.2, d.y - d.s * 0.2 + Math.sin(a) * d.s * 0.4, ex, ey);
        tips.push([ex, ey]);
      }
      ctx.stroke();
      ctx.fillStyle = `hsl(${d.hue},100%,85%)`;
      ctx.beginPath();
      for (const [x, y] of tips) { ctx.moveTo(x + d.s * 0.05, y); ctx.arc(x, y, d.s * 0.05, 0, TAU); }
      ctx.fill();
      break;
    }
    case 'grass': {
      ctx.strokeStyle = '#3f9a55'; ctx.lineWidth = d.s * 0.07; ctx.lineCap = 'round';
      ctx.beginPath();
      for (let i = 0; i < d.n; i++) {
        const bx = d.x + (i - d.n / 2) * d.s * 0.12;
        const sw = Math.sin(time * 1.3 + d.phase + i) * d.s * 0.25;
        ctx.moveTo(bx, d.y);
        ctx.quadraticCurveTo(bx + sw * 0.3, d.y - d.s * 0.6, bx + sw, d.y - d.s * (0.8 + (i % 3) * 0.15));
      }
      ctx.stroke();
      break;
    }
  }
}

function drawDecorList(list, x0, x1, margin) {
  for (const d of list) {
    if (d.x < x0 - margin) continue;
    if (d.x > x1 + margin) break;
    drawDecorItem(d);
  }
}

function drawFloor(x0, x1) {
  ctx.beginPath();
  ctx.moveTo(x0, WORLD.h + 400);
  const s0 = Math.floor(x0 / FSTEP) * FSTEP;
  for (let x = s0; x <= x1 + FSTEP; x += FSTEP) ctx.lineTo(x, floorY(x));
  ctx.lineTo(x1 + FSTEP, WORLD.h + 400);
  ctx.closePath();
  const g = ctx.createLinearGradient(0, 1300, 0, 4400);
  g.addColorStop(0, '#f0dca4'); g.addColorStop(0.3, '#c9ae74'); g.addColorStop(0.65, '#7d6844'); g.addColorStop(1, '#3a3128');
  ctx.fillStyle = g;
  ctx.fill();
  // pebbles
  ctx.fillStyle = 'rgba(80,60,40,0.25)';
  ctx.beginPath();
  for (let x = s0; x <= x1; x += FSTEP) {
    const h = hash(x * 0.37);
    if (h < 0.55) continue;
    const px = x + h * FSTEP, py = floorY(px) + 8 + hash(x) * 60, pr = 2 + hash(x * 1.7) * 5;
    ctx.moveTo(px + pr, py); ctx.ellipse(px, py, pr, pr * 0.6, 0, 0, TAU);
  }
  ctx.fill();
  // sunlit lip
  ctx.beginPath();
  for (let x = s0; x <= x1 + FSTEP; x += FSTEP) { const y = floorY(x); x === s0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
  ctx.strokeStyle = 'rgba(255,245,210,0.35)';
  ctx.lineWidth = Math.max(3, 3 / zoom);
  ctx.stroke();
  // caustic shimmer on shallow sand
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = 'rgba(200,255,255,0.06)';
  ctx.beginPath();
  for (let x = s0; x <= x1; x += FSTEP * 3) {
    const y = floorY(x);
    if (y > 2600) continue;
    const s = 14 + 10 * Math.sin(time * 1.3 + x * 0.05);
    ctx.moveTo(x + s, y + 14); ctx.ellipse(x, y + 14, s, s * 0.3, 0, 0, TAU);
  }
  ctx.fill();
  ctx.restore();
}

// ============================================================ drawing: scene
const FAR = [
  { p: 0.3, s: 0.45, n: makeNoise(5), base: 2600, amp: 750, alpha: 0.24, seed: 1, off: 3100 },
  { p: 0.55, s: 0.68, n: makeNoise(9), base: 2800, amp: 850, alpha: 0.32, seed: 2, off: 900 },
];
function drawFar(L) {
  const z = zoom * L.s;
  const cx = cam.x * L.p + L.off, cy = cam.y;
  ctx.setTransform(DPR * z, 0, 0, DPR * z, DPR * (W / 2 - cx * z), DPR * (H / 2 - cy * z));
  const x0 = cx - W / 2 / z - 60, x1 = cx + W / 2 / z + 60, yb = cy + H / 2 / z + 20;
  const ridge = (x) => L.base + L.n(x / 1500) * L.amp + L.n(x / 380 + 50) * L.amp * 0.12;
  const step = 30 / z;
  ctx.beginPath();
  ctx.moveTo(x0, yb);
  for (let x = x0; x <= x1 + step; x += step) ctx.lineTo(x, ridge(x));
  ctx.lineTo(x1 + step, yb);
  ctx.closePath();
  const B = 460;
  for (let b = Math.floor(x0 / B) - 1; b <= Math.floor(x1 / B) + 1; b++) {
    if (hash(b * 3.1 + L.seed * 17) < 0.5) continue;
    const sx = b * B + hash(b * 7.7 + L.seed) * B, gy = ridge(sx) + 60;
    const hgt = 300 + hash(b * 1.3 + L.seed * 5) * 1000, wid = 60 + hash(b * 2.9 + L.seed) * 130;
    ctx.moveTo(sx - wid, gy);
    ctx.quadraticCurveTo(sx - wid * 0.55, gy - hgt * 0.5, sx - wid * 0.25, gy - hgt);
    ctx.quadraticCurveTo(sx, gy - hgt * 1.04, sx + wid * 0.3, gy - hgt * 0.94);
    ctx.quadraticCurveTo(sx + wid * 0.65, gy - hgt * 0.4, sx + wid, gy);
    ctx.closePath();
  }
  ctx.fillStyle = `rgba(2,22,44,${L.alpha})`;
  ctx.fill();
  // far kelp silhouettes
  ctx.strokeStyle = `rgba(2,30,40,${L.alpha * 0.9})`;
  ctx.lineWidth = 10;
  ctx.lineCap = 'round';
  ctx.beginPath();
  const K = 140;
  for (let b = Math.floor(x0 / K); b <= Math.floor(x1 / K) + 1; b++) {
    if (hash(b * 5.3 + L.seed * 9) < 0.72) continue;
    const kx = b * K + hash(b + L.seed) * K, gy = ridge(kx) + 30, kh = 300 + hash(b * 9.1) * 700;
    const sw = Math.sin(time * 0.6 + b) * 60;
    ctx.moveTo(kx, gy);
    ctx.bezierCurveTo(kx + sw * 0.3, gy - kh * 0.35, kx - sw * 0.4, gy - kh * 0.7, kx + sw, gy - kh);
  }
  ctx.stroke();
}

function drawRays() {
  const sy = (0 - cam.y) * zoom + H / 2;
  const len = Math.max(H * 1.2, 1900 * zoom);
  if (sy + len < 0) return;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const spacing = 150, shift = cam.x * zoom * 0.5;
  const first = Math.floor(shift / spacing) - 3;
  for (let i = first; i < first + W / spacing + 7; i++) {
    const h = hash(i * 1.37);
    if (h < 0.3) continue;
    const x = i * spacing - shift + h * 70 + Math.sin(time * 0.25 + i) * 30;
    const w = 18 + h * 60, slant = len * 0.22, spread = len * (0.08 + h * 0.12);
    const a = (0.05 + 0.07 * h) * (0.75 + 0.25 * Math.sin(time * 0.7 + i * 2.1));
    const g = ctx.createLinearGradient(0, sy, 0, sy + len);
    g.addColorStop(0, `rgba(200,250,255,${a})`);
    g.addColorStop(0.6, `rgba(160,235,255,${a * 0.35})`);
    g.addColorStop(1, 'rgba(160,235,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(x - w / 2, sy); ctx.lineTo(x + w / 2, sy);
    ctx.lineTo(x + w / 2 + slant + spread, sy + len); ctx.lineTo(x - w / 2 + slant - spread, sy + len);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function waveY(x) { return Math.sin(x * 0.012 + time * 1.6) * 7 + Math.sin(x * 0.031 - time * 2.2) * 3; }

function drawSurface(x0, x1, yTop) {
  if (yTop > 120) return;
  const step = 24;
  const sg = ctx.createLinearGradient(0, yTop, 0, 0);
  sg.addColorStop(0, '#8fd6ff'); sg.addColorStop(1, '#e6f8ff');
  ctx.beginPath();
  ctx.moveTo(x0, yTop - 100);
  ctx.lineTo(x1, yTop - 100);
  for (let x = x1; x >= x0 - step; x -= step) ctx.lineTo(x, waveY(x));
  ctx.closePath();
  ctx.fillStyle = sg; ctx.fill();
  // sun glare
  const sunX = cam.x + viewW() * 0.25;
  const rg = ctx.createRadialGradient(sunX, -140, 0, sunX, -140, 420);
  rg.addColorStop(0, 'rgba(255,255,230,0.9)'); rg.addColorStop(1, 'rgba(255,255,230,0)');
  ctx.fillStyle = rg; ctx.fillRect(sunX - 420, -560, 840, 560);
  // wave line + under-surface glow
  ctx.beginPath();
  for (let x = x0 - step; x <= x1 + step; x += step) { const y = waveY(x); x === x0 - step ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
  ctx.strokeStyle = 'rgba(255,255,255,0.85)';
  ctx.lineWidth = Math.max(3, 2.5 / zoom);
  ctx.stroke();
  const ug = ctx.createLinearGradient(0, 0, 0, 140);
  ug.addColorStop(0, 'rgba(210,255,255,0.35)'); ug.addColorStop(1, 'rgba(210,255,255,0)');
  ctx.fillStyle = ug; ctx.fillRect(x0, 0, x1 - x0, 140);
}

function drawJelly(j) {
  const pulse = 0.5 + 0.5 * Math.sin(j.phase);
  const bw = j.r * (1 + pulse * 0.14), bh = j.r * (0.82 - pulse * 0.14);
  ctx.strokeStyle = `hsla(${j.hue},90%,78%,0.5)`;
  ctx.lineWidth = Math.max(1 / zoom, j.r * 0.05);
  ctx.beginPath();
  for (let i = 0; i < 7; i++) {
    const x0 = j.x + (i / 6 - 0.5) * bw * 1.5;
    ctx.moveTo(x0, j.y);
    for (let s = 1; s <= 9; s++) {
      ctx.lineTo(x0 + Math.sin(time * 2.4 + s * 0.65 + i * 1.3) * j.r * 0.12 * (s / 4), j.y + s * j.r * 0.3);
    }
  }
  ctx.stroke();
  ctx.strokeStyle = `hsla(${j.hue},90%,85%,0.7)`;
  ctx.lineWidth = Math.max(1.5 / zoom, j.r * 0.13);
  ctx.beginPath();
  for (let i = 0; i < 3; i++) {
    const x0 = j.x + (i - 1) * bw * 0.22;
    ctx.moveTo(x0, j.y);
    ctx.bezierCurveTo(x0 + Math.sin(time * 1.6 + i) * j.r * 0.3, j.y + j.r * 0.8, x0 - Math.sin(time * 1.3 + i) * j.r * 0.3, j.y + j.r * 1.4, x0, j.y + j.r * 1.9);
  }
  ctx.stroke();
  const g = ctx.createRadialGradient(j.x, j.y - bh * 0.4, 0, j.x, j.y, bw);
  g.addColorStop(0, `hsla(${j.hue},100%,93%,0.92)`);
  g.addColorStop(0.55, `hsla(${j.hue},90%,70%,0.6)`);
  g.addColorStop(1, `hsla(${j.hue},85%,55%,0.3)`);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.ellipse(j.x, j.y, bw, bh, 0, Math.PI, TAU);
  const sc = 6;
  for (let i = 0; i < sc; i++) {
    const xa = j.x + bw - (i + 0.5) * (2 * bw / sc), xb = j.x + bw - (i + 1) * (2 * bw / sc);
    ctx.quadraticCurveTo(xa, j.y + bh * 0.22, xb, j.y);
  }
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = `hsla(${j.hue},100%,92%,0.6)`;
  ctx.lineWidth = Math.max(1 / zoom, j.r * 0.04);
  ctx.stroke();
}

function drawPearl(p) {
  const bob = Math.sin(time * 2 + p.ph) * p.r * 0.4;
  if (p.life < 3 && Math.floor(time * 8) % 2) return;
  const x = p.x, y = p.y + bob;
  const g = ctx.createRadialGradient(x - p.r * 0.35, y - p.r * 0.35, p.r * 0.05, x, y, p.r);
  g.addColorStop(0, '#ffffff'); g.addColorStop(0.5, '#ffe6f5'); g.addColorStop(1, '#c9a8e8');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, p.r, 0, TAU); ctx.fill();
  ctx.save();
  ctx.translate(x, y); ctx.rotate(time * 1.5);
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  for (let i = 0; i < 4; i++) {
    ctx.rotate(Math.PI / 2);
    ctx.beginPath(); ctx.moveTo(0, -p.r * 0.15); ctx.lineTo(p.r * 2.2, 0); ctx.lineTo(0, p.r * 0.15); ctx.fill();
  }
  ctx.restore();
}

function drawParticles() {
  for (const p of particles) {
    const a = clamp(p.life / p.max, 0, 1);
    if (p.type === 'bubble') {
      ctx.strokeStyle = `rgba(220,250,255,${0.55 * a})`;
      ctx.lineWidth = Math.max(0.8 / zoom, p.size * 0.15);
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, TAU); ctx.stroke();
      ctx.fillStyle = `rgba(255,255,255,${0.6 * a})`;
      ctx.beginPath(); ctx.arc(p.x - p.size * 0.35, p.y - p.size * 0.35, p.size * 0.25, 0, TAU); ctx.fill();
    } else if (p.type === 'bit') {
      ctx.globalAlpha = a;
      ctx.fillStyle = p.col;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
    } else if (p.type === 'spark') {
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = a;
      ctx.fillStyle = p.col;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.5 + a), 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    } else if (p.type === 'ring') {
      const t = 1 - a;
      ctx.strokeStyle = p.col + (0.6 * a) + ')';
      ctx.lineWidth = Math.max(1 / zoom, p.size * 0.08 * a);
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.3 + t), 0, TAU); ctx.stroke();
    }
  }
}

function drawDarkness(yTop, yBot) {
  if (Math.max(darkAt(yTop), darkAt(yBot)) < 0.02) return;
  const dw = darkCvs.width, dh = darkCvs.height, s = dw / W;
  dctx.setTransform(1, 0, 0, 1, 0, 0);
  dctx.globalCompositeOperation = 'source-over';
  dctx.clearRect(0, 0, dw, dh);
  const g = dctx.createLinearGradient(0, 0, 0, dh);
  for (let i = 0; i <= 6; i++) { const t = i / 6; g.addColorStop(t, `rgba(1,6,20,${darkAt(lerp(yTop, yBot, t))})`); }
  dctx.fillStyle = g;
  dctx.fillRect(0, 0, dw, dh);
  dctx.globalCompositeOperation = 'destination-out';
  const hole = (wx, wy, rad, str) => {
    const sx = ((wx - cam.x) * zoom + W / 2) * s, sy = ((wy - cam.y) * zoom + H / 2) * s, R = rad * zoom * s;
    if (R < 1 || sx < -R || sy < -R || sx > dw + R || sy > dh + R) return;
    const rg = dctx.createRadialGradient(sx, sy, 0, sx, sy, R);
    rg.addColorStop(0, `rgba(0,0,0,${str})`); rg.addColorStop(1, 'rgba(0,0,0,0)');
    dctx.fillStyle = rg;
    dctx.fillRect(sx - R, sy - R, R * 2, R * 2);
  };
  if (player.active && player.alive) hole(player.x, player.y, player.r * 8, 0.9);
  for (const j of jellies) hole(j.x, j.y + j.r * 0.5, j.r * 4, 0.75);
  for (const p of pearls) hole(p.x, p.y, p.r * 8, 0.8);
  for (const a of decor.glow) hole(a.x, a.y - a.s * 0.4, a.s * 2.4, 0.7);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(darkCvs, 0, 0, cvs.width, cvs.height);
}

function glowAt(x, y, r, col) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(x - r, y - r, r * 2, r * 2);
}

function worldToScreen(x, y) { return [(x - cam.x) * zoom + W / 2, (y - cam.y) * zoom + H / 2]; }

function render() {
  const yTop = cam.y - H / 2 / zoom, yBot = cam.y + H / 2 / zoom;
  const x0 = cam.x - W / 2 / zoom, x1 = cam.x + W / 2 / zoom;
  const shake = game.state === 'paused' ? 0 : game.shake;
  const shx = (Math.random() - 0.5) * shake * 2, shy = (Math.random() - 0.5) * shake * 2;

  // water
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  for (let i = 0; i <= 4; i++) { const t = i / 4; bg.addColorStop(t, rgba(waterAt(Math.max(0, lerp(yTop, yBot, t))))); }
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  for (const L of FAR) drawFar(L);
  drawRays();

  const setWorld = () => ctx.setTransform(DPR * zoom, 0, 0, DPR * zoom, DPR * (W / 2 - cam.x * zoom + shx), DPR * (H / 2 - cam.y * zoom + shy));
  setWorld();
  drawSurface(x0 - 40, x1 + 40, yTop);
  drawDecorList(decor.back, x0, x1, 120);
  drawFloor(x0 - 40, x1 + 40);
  drawDecorList(decor.mid, x0, x1, 300);
  drawDecorList(decor.front, x0, x1, 150);
  for (const j of jellies) drawJelly(j);

  // danger halos so threats read at a glance
  const pr = focusR();
  if (player.active) {
    for (const f of fish) {
      if (f.r < pr * DANGER || f.x < x0 - f.r * 2 || f.x > x1 + f.r * 2) continue;
      const hot = f.state === 'chase' && f.kind !== 'shark' ? 1 : f.kind === 'shark' && f.state === 'chase' ? 1 : 0;
      const a = 0.17 + hot * (0.13 + 0.09 * Math.sin(time * 10));
      glowAt(f.x, f.y, f.r * 2.3, `rgba(255,40,60,${a})`);
    }
  }
  const sorted = fish.slice().sort((a, b) => (a.kind === 'shark') - (b.kind === 'shark') || b.r - a.r);
  for (const f of sorted) {
    if (f.x < x0 - f.r * 3 || f.x > x1 + f.r * 3 || f.y < yTop - f.r * 3 || f.y > yBot + f.r * 3) continue;
    drawFish(f, false);
  }

  drawDarkness(yTop, yBot);
  setWorld();

  // glow pass
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const j of jellies) glowAt(j.x, j.y, j.r * 3, `hsla(${j.hue},100%,70%,0.22)`);
  for (const a of decor.glow) if (a.x > x0 - 200 && a.x < x1 + 200) glowAt(a.x, a.y - a.s * 0.4, a.s * 1.6, `hsla(${a.hue},100%,65%,0.28)`);
  for (const p of pearls) glowAt(p.x, p.y, p.r * 5, 'rgba(255,220,250,0.35)');
  if (player.active && player.alive) {
    const deep = clamp((player.y - 1200) / 2500, 0, 1);
    glowAt(player.x, player.y, player.r * 4, `rgba(80,255,220,${0.05 + deep * 0.12})`);
  }
  ctx.restore();

  for (const p of pearls) drawPearl(p);
  if (player.active && player.alive) {
    const blinkOut = player.invuln > 0 && Math.floor(time * 12) % 2 === 0;
    if (!blinkOut) drawFish(player, true);
    if (player.shield > 0) {
      const a = player.shield < 2 ? 0.3 + 0.3 * Math.sin(time * 20) : 0.6;
      const R = player.r * 1.9 + Math.sin(time * 4) * player.r * 0.08;
      ctx.strokeStyle = `rgba(170,245,255,${a})`;
      ctx.lineWidth = Math.max(1.5 / zoom, player.r * 0.08);
      ctx.beginPath(); ctx.arc(player.x, player.y, R, 0, TAU); ctx.stroke();
      ctx.fillStyle = `rgba(170,245,255,${a * 0.15})`; ctx.fill();
      ctx.fillStyle = `rgba(255,255,255,${a})`;
      ctx.beginPath(); ctx.ellipse(player.x - R * 0.45, player.y - R * 0.5, R * 0.22, R * 0.1, -0.7, 0, TAU); ctx.fill();
    }
    if (player.stun > 0) {
      ctx.fillStyle = '#fff6a8';
      for (let i = 0; i < 3; i++) {
        const a = time * 6 + (i * TAU) / 3;
        const sx = player.x + Math.cos(a) * player.r * 0.9, sy = player.y - player.r * 1.3 + Math.sin(a) * player.r * 0.25;
        ctx.beginPath(); ctx.arc(sx, sy, player.r * 0.12, 0, TAU); ctx.fill();
      }
    }
  }
  drawParticles();

  // ---- screen space
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  for (const p of snow) {
    const sx = (((p.x - cam.x * zoom * p.z) % (W + 40)) + W + 40) % (W + 40) - 20;
    const sy = (((p.y - cam.y * zoom * p.z + time * 8 * p.z) % (H + 40)) + H + 40) % (H + 40) - 20;
    ctx.fillStyle = `rgba(220,245,255,${0.12 + p.z * 0.3})`;
    ctx.beginPath(); ctx.arc(sx + Math.sin(time + p.ph) * 4, sy, 0.6 + p.z * 1.6, 0, TAU); ctx.fill();
  }

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  for (const t of texts) {
    const a = clamp(t.life / t.max, 0, 1);
    const [sx, sy] = worldToScreen(t.x, t.y);
    const rise = (1 - a) * 46;
    const sc = a > 0.85 ? 1 + (a - 0.85) * 3 : 1;
    ctx.font = `900 ${t.size * sc}px ui-rounded, "SF Pro Rounded", "Avenir Next", system-ui, sans-serif`;
    ctx.globalAlpha = Math.min(1, a * 1.6);
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(0,30,50,0.7)';
    ctx.strokeText(t.text, sx, sy - rise);
    ctx.fillStyle = t.col;
    ctx.fillText(t.text, sx, sy - rise);
    ctx.globalAlpha = 1;
  }

  // "!" alerts and off-screen threat arrows
  if (playing()) {
    for (const f of fish) {
      const threat = f.r >= player.r * DANGER && (f.state === 'chase');
      if (!threat && !f.alertT) continue;
      const [sx, sy] = worldToScreen(f.x, f.y);
      const on = sx > 0 && sx < W && sy > 0 && sy < H;
      if (on && f.alertT > 0) {
        const b = Math.abs(Math.sin((1.1 - f.alertT) * 8)) * 8;
        ctx.font = '900 30px ui-rounded, system-ui, sans-serif';
        ctx.lineWidth = 6; ctx.strokeStyle = '#ffffff';
        const ty = sy - f.r * 1.2 * zoom - 22 - b;
        ctx.strokeText('!', sx, ty);
        ctx.fillStyle = '#ff2d4a'; ctx.fillText('!', sx, ty);
      } else if (!on && threat) {
        const dx = sx - W / 2, dy = sy - H / 2;
        const m = Math.min((W / 2 - 34) / Math.abs(dx || 1e-3), (H / 2 - 34) / Math.abs(dy || 1e-3));
        const ax = W / 2 + dx * m, ay = H / 2 + dy * m, ang = Math.atan2(dy, dx);
        const pulse = 0.6 + 0.4 * Math.sin(time * 10);
        ctx.save();
        ctx.translate(ax, ay); ctx.rotate(ang);
        ctx.fillStyle = `rgba(255,45,74,${pulse})`;
        ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(16, 0); ctx.lineTo(-10, -13); ctx.lineTo(-5, 0); ctx.lineTo(-10, 13); ctx.closePath();
        ctx.fill(); ctx.stroke();
        ctx.restore();
      }
    }
  }

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(vignette, 0, 0);
}

// ============================================================ loop
genWorld();
menuCam.x = findStart().x;
cam.x = menuCam.x; cam.y = floorY(cam.x) - 480;
zoom = zoomFor(22);
for (let i = 0; i < 60; i++) spawnOne(true);

let last = performance.now();
function frame(now) {
  let dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (game.state !== 'paused') {
    if (game.slowT > 0) { game.slowT -= dt; dt *= 0.35; }
    update(dt);
  }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

window.__deepFeast = { game, player, fish, jellies, cam, startGame, spawnShark, floorY, get zoom() { return zoom; } };
})();
</script>
