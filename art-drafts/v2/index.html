<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deep Feast · Unity visual review v2</title><style>
:root{color-scheme:dark;--bg:#071d2d;--surface:#0d293a;--line:#28485b;--muted:#a1bac8;--mint:#75e6d1;--gold:#ffd580}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f2fafb;font-family:"Avenir Next",system-ui,sans-serif}main{max-width:1260px;margin:auto;padding:18px 18px 12px}.eyebrow{color:var(--mint);font-size:10px;font-weight:800;letter-spacing:2px;text-transform:uppercase}header{display:flex;justify-content:space-between;gap:20px;align-items:start;margin-bottom:13px}h1{font-size:27px;letter-spacing:-.7px;margin:5px 0}header p{color:var(--muted);font-size:12px;margin:0;line-height:1.45}.badge{border:1px solid var(--line);border-radius:30px;padding:7px 10px;font-size:10px;letter-spacing:1px;color:var(--gold);white-space:nowrap}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}.cardhead{padding:8px 12px;display:flex;justify-content:space-between;gap:8px;align-items:center}.cardhead h2{font-size:14px;margin:0}.cardhead span{font-size:10px;color:var(--muted);text-align:right}.pair{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}.pane{padding-top:6px;background:#0b2b41;min-width:0}.label{text-align:center;font-size:9px;font-weight:800;letter-spacing:1.5px;color:var(--muted);display:block;margin-bottom:2px}.label.proposal{color:var(--mint)}canvas.thumb{display:block;width:245px;max-width:100%;height:155px;margin:auto}.poses .pair .frames{display:grid;grid-template-columns:1fr 1fr}.poses .cardhead{padding:11px 14px}.poses .frame-note{text-align:center;font-size:9px;letter-spacing:1px;color:var(--muted);margin:3px 0 8px}.poses .pane{padding-top:9px}.poses .card{margin-bottom:18px}.poses .pair .pane{min-height:209px}.scene{display:grid;grid-template-columns:1fr 1fr;gap:14px}.scene figure{margin:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}figcaption{padding:10px 12px;font-size:10px;font-weight:800;letter-spacing:1.6px;color:var(--muted)}.scene .proposed figcaption{color:var(--mint)}.scene img{display:block;width:100%}.notes{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}.notes div{padding:15px;border:1px solid var(--line);border-radius:10px}.notes b{font-size:13px}.notes p{font-size:11px;line-height:1.5;color:var(--muted);margin:6px 0 0}footer{font-size:10px;line-height:1.5;color:var(--muted);display:flex;justify-content:space-between;gap:15px;margin-top:13px}nav{display:flex;gap:8px;margin:13px 0}button{border:1px solid var(--line);border-radius:8px;background:var(--surface);color:#edf8fa;font:600 12px "Avenir Next",system-ui;padding:9px 13px;cursor:pointer}button[aria-pressed=true]{background:var(--mint);color:var(--bg);border-color:var(--mint)}a{color:var(--mint)}button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:3px}.export nav{display:none}.export .links{display:none}.poses .subtitle-note{font-size:12px;line-height:1.6;color:var(--muted);padding:13px 16px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
@media(max-width:760px){.grid,.scene,.notes{grid-template-columns:1fr}header{display:block}.badge{display:inline-block;margin-top:9px}.cardhead span{max-width:145px}.poses .frames{grid-template-columns:1fr!important}.poses .pane{min-width:0}canvas.thumb{height:auto;aspect-ratio:245/155}footer{display:block}nav{flex-wrap:wrap}}
.export main{padding-top:14px;padding-bottom:8px}.export footer{margin-top:9px}
</style></head><body><main><header><div><div class="eyebrow">Deep Feast / Unity polish proposals v2</div><h1 id="title"></h1><p id="description"></p></div><div class="badge">NATIVE UNITY BASELINE · 5f75e02</div></header><nav aria-label="Comparisons"><button data-view="species" aria-pressed="true">Remaining fish</button><button data-view="environment" aria-pressed="false">Reef & lighting</button><button data-view="poses" aria-pressed="false">Bite poses</button><button data-view="installed" aria-pressed="false">Installed Unity gallery</button></nav><section id="content"></section><footer><span>Left: actual rebuilt Unity app. Right: generated review concept. No game source or assets were changed.</span><span class="links"><a href="REVIEW.md">Implementation review</a> · <a href="prompts.json">Exact prompts</a></span><span>Build verified · proposed art not integrated</span></footer></main><script>
const sources={};async function img(src){if(!sources[src]){const i=new Image();i.src=src;await i.decode();sources[src]=i}return sources[src]}
const species=[['Minnow',128,216,0,0,'Silver-blue; slim silhouette'],['Parrotfish',128,403,1,0,'Jade scales; pink beak and fins'],['Snapper',384,403,2,0,'Coral-red; richer shading'],['Barracuda',640,403,0,1,'Long jaw; small predatory eye'],['Grouper',896,403,1,1,'Heavy lip; rounded brown body'],['Tuna',1152,403,2,1,'Silver belly; crescent tail']];
function label(draft){return `<span class="label ${draft?'proposal':''}">${draft?'PROPOSED V2':'INSTALLED UNITY'}</span>`}
function thumb(data){return `<canvas class="thumb" width="245" height="155" data-draw='${JSON.stringify(data)}' role="img" aria-label="${data.alt}"></canvas>`}
function current(src,x,y,alt){return thumb({src,kind:'current',x,y,alt})}
function drafted(src,col,row,kind,alt){return thumb({src,kind,col,row,alt})}
async function draw(){await Promise.all(Array.from(document.querySelectorAll('canvas[data-draw]'),async c=>{const d=JSON.parse(c.dataset.draw),im=await img(d.src),ctx=c.getContext('2d');if(d.kind==='current'){ctx.drawImage(im,d.x-90,d.y-90,180,180,0,-45,245,245)}else if(d.kind==='species'){const cell=im.width/3;const y=d.row===0?145:550;ctx.drawImage(im,d.col*cell,y,cell,330,0,-1,245,330*245/cell)}else{const cw=im.width/2;const sy=d.row===0?90:500;const sw=cw-100;ctx.drawImage(im,d.col*cw+60,sy,sw,370,0,(155-370*245/sw)/2,245,370*245/sw)}}));document.body.dataset.ready='true'}
async function show(view){document.body.dataset.ready='false';document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===view));let title,description,markup;const gallery='references/unity-gallery/gallery.png',bite='references/unity-gallery/gallery_bite.png';if(view==='species'){title='Finish the fish family.';description='These six species still use procedural art. Match them to the painted fish already installed.';markup=`<div class="grid">${species.map(([name,x,y,col,row,note])=>`<article class="card"><div class="cardhead"><h2>${name}</h2><span>${note}</span></div><div class="pair"><div class="pane">${label(false)}${current(gallery,x,y,'Current Unity '+name)}</div><div class="pane">${label(true)}${drafted('concepts/remaining-six-fish-v2.png',col,row,'species','Proposed '+name)}</div></div></article>`).join('')}</div>`}else if(view==='environment'){title='Give the reef the fish’s level of finish.';description='Same terrain and camera: softer light, layered reef forms, coherent materials, and calmer sand detail.';markup=`<div class="scene"><figure><figcaption>INSTALLED · REBUILT UNITY 5f75e02</figcaption><img src="references/unity-reef/play_00_t4_r30.png" alt="Actual current Unity reef gameplay"></figure><figure class="proposed"><figcaption>PROPOSED V2 · VISUAL MOCKUP</figcaption><img src="concepts/reef-lighting-depth-v2.png" alt="Proposed cohesive reef lighting and material polish"></figure></div><div class="notes"><div><b>Depth before decoration</b><p>Rounder layered reefs and depth-tinted kelp; retain a clear swimming corridor.</p></div><div><b>Materials that belong together</b><p>Fish, coral, rocks, and sand share one shading and light direction.</p></div><div><b>Softer light and sand</b><p>Broken sun shafts, subtle terrain shadows, organic ripples, and sparse caustics.</p></div></div>`}else if(view==='poses'){title='A bite that changes the silhouette.';description='Current forced bite-gallery poses compared with proposed jaw articulation and matching painted keys.';markup=`<div class="poses">${[['Player',591,0],['Clownfish',216,1]].map(([name,y,row])=>`<article class="card"><div class="cardhead"><h2>${name}</h2><span>Same identity; stronger jaw and cheek movement</span></div><div class="pair"><div class="pane">${label(false)}<div class="frames"><div>${current(gallery,384,y,'Current '+name+' relaxed pose')}<div class="frame-note">RELAXED</div></div><div>${current(bite,384,y,'Current '+name+' forced chase/bite pose')}<div class="frame-note">FORCED BITE</div></div></div></div><div class="pane">${label(true)}<div class="frames"><div>${drafted('concepts/player-clown-bite-poses-v2.png',0,row,'pose','Proposed '+name+' relaxed key')}<div class="frame-note">RELAXED KEY</div></div><div>${drafted('concepts/player-clown-bite-poses-v2.png',1,row,'pose','Proposed '+name+' open jaw key')}<div class="frame-note">OPEN JAW KEY</div></div></div></div></div></article>`).join('')}<div class="subtitle-note">These are pose concepts, not a finished animation. The left-side gallery deliberately forces chase + bite on every fish, including the player.</div></div>`}else{title='What is actually installed.';description='Fresh native Unity gallery: six imported fish, six procedural species, two jelly colors, and the pearl.';markup=`<div class="scene"><figure><figcaption>RELAXED GALLERY · NATIVE UNITY</figcaption><img src="${gallery}" alt="All installed species normal poses"></figure><figure><figcaption>FORCED CHASE + BITE GALLERY · NATIVE UNITY</figcaption><img src="${bite}" alt="All installed species forced bite poses"></figure></div><div class="notes"><div><b>Imported from v1</b><p>Player, clown, tang, puffer, angel, shark, jelly bell, and occasional reef group.</p></div><div><b>Recreated in code</b><p>Pearl halo, kelp leaves, procedural coral, lighting, depth effects, and HUD.</p></div><div><b>Still unfinished</b><p>Six species use procedural art, and the bite keys mostly retain the closed head shape.</p></div></div>`}document.getElementById('title').textContent=title;document.getElementById('description').textContent=description;document.getElementById('content').innerHTML=markup;document.title='Deep Feast · '+title;await Promise.all(Array.from(document.images,im=>im.decode()));await draw()}
const params=new URLSearchParams(location.search);if(params.has('export'))document.body.classList.add('export');show(params.get('view')||'species');document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>{show(b.dataset.view);history.replaceState({},'',`?view=${b.dataset.view}`)}));
</script></body></html>
